  COX_GAN_war_lose_tt:0"\n尽管我们竭尽全力，但西北军仍然得以§R全身而退§!。\n在西北军撤退时，他们对当地实施了惨绝人寰的焦土政策，这将使我们的整合进度§R倒退§!20点。"
  
  LFB_COX_nc.18.t:0"跨过黄河"
  LFB_COX_nc.18.d:0"是夜将明之时，西北抗日阵线的一队侦察兵再度抵达了晋陕之交。靛蓝色的天穹下，漆黑的黄河无声地流淌，河水两岸并无灯火，清冷的空气几近让人窒息。敌人轰炸机的威胁，令他们只能抓住夜幕消逝前的短暂空隙，遍寻一座座老渡口，以供大部队通过。“这儿一个鬼子都没有。”黄河左岸的树林间鬼影憧憧，似乎只是夜风的把戏。\n\n“做准备吧。”老班长授意道。\n\n片刻之后，一颗照明弹如流星般高高升起，右岸密林中响起了枪声，侦察兵们引燃了炸药，巨响在宽阔的河上回荡……\n\n左岸突然亮起了数盏探照灯，日军徒劳地端起步枪机枪，朝着河面警戒着。按照已经校准的射角，几枚迫击炮弹落在了对岸的密林中，数声闷响后，连鸟雀都惊不出来——显而易见的是，如同数个月来的每一次袭扰一样，红军侦察兵早已经消失的无影无踪。日本兵早已被这样的骚扰弄得心烦意乱，警戒在半个小时后就解除了，士兵们解下装具，收起步枪，打算安心睡一觉。毕竟，红军每夜只来一次，在摸清这规律后，他们便在前半夜和衣入睡，等到敌人的“袭扰”结束后，便可以不受军官阻拦的睡个好觉了。此刻，黄河沿岸的大部分日军都放松了警惕，毕竟，大日本帝国已倾其所有在黄河筑成了牢不可破的大堤，每一处渡口都严加戒备，每一个据点都固若金汤……\n黎明十分，天边隐约响起隆隆炮响，宛如惊雷般的炮弹在右岸的日军营垒间精准地炸开。从睡梦中惊醒的士兵们匆忙来到黄河边，在金黄色的朝阳下，一叶叶小柯宛如洒在黄河中的项链，原来红军早已过了河！\n通过疲敌之策，红军突破了山西的第一道防线。"
  LFB_COX_nc.18.a:0"华北的门户就在我们眼前！"
  ##已经完成的事件
  LFB_COX_nc.4.t:0"疯狗之死"
  LFB_COX_nc.4.d:0"£gezifu £gezifu 事情是怎么到这个地步的？整个西北方面军不知道，辻政信也不知道，几个月前，他还是这几十万平方公里土地的唯一主宰。转眼间，兰州和天水接连被攻克，整支西北方面军都被红军彻底包围。\n£gezifu £gezifu 等等？红军？\n£gezifu £gezifu 但是辻政信没时间想这些，他在中国军队彻底包围指挥部之前找到了一匹快马，头也不回地逃离了。\n£gezifu £gezifu “等到我回到东京，我一定要说服军部再给我一支军队，然后再次回到西北！ 再杀一遍！”\n£gezifu £gezifu 长途的骑行和滴水未进使得这个六十二岁的老人逐渐体力不支，他的精神逐渐模糊，他的四肢慢慢无力。\n£gezifu £gezifu “难道上天真的要亡我于此？”\n£gezifu £gezifu 终于，他本能地将马匹的速度降了下来，然后竭尽全力让自己坐在马上。\n£gezifu £gezifu “呼，呼，我只需要…休息一会…”\n£gezifu £gezifu 他再次醒来时，发现自己的床边围着全村的人，所有人都盯着他，辻政信见过这种眼神，在菲律宾，一个濒死的美国战俘曾经这样看着他\n£gezifu £gezifu 辻政信故作镇定地从床上爬起，然后慢慢向村子外面走去，人群中自动让出一条道路。\n£gezifu £gezifu 他走出了屋子，一开始是走着的，然后慢慢变成跑步，最后几乎是竭尽全力地跑。\n£gezifu £gezifu 土枪，菜刀，锄头，剪刀，都跟在后面。\n£gezifu £gezifu 好像是天注定的，辻政信被一块石头绊倒，他很快地翻过身来，恐惧地看着一张张如黄土般的面庞，这些人中，他一个也不认识，但是他们认识他。\n£gezifu £gezifu “したくない！ したくない！ 助けて！”（不！不！救救我啊！）"
  LFB_COX_nc.4.a:0"大快人心事！"
  COX_tsuji_masanobu_death_tt:0"人面兽心的怪物终于迎来了自己的结局：不是在战场上壮烈牺牲，而是被自己所蔑视的，蝼蚁一般的人们踩在脚下。\n"
  LFB_COX_nc.5.t:0"功亏一篑"
  LFB_COX_nc.5.d:0"£gezifu £gezifu 辻政信此时端坐在机舱内，天皇御赐的菊花纹军刀立在双腿之中，他面容肃穆，戴着白手套的两只手交叉摁住刀柄。坐在身旁的则是他的军官团。飞机在跑道上滑行，缓缓起飞，目标沧州。虽然他并未在兰州为帝国带来大胜，但天皇已经发下谕旨——鉴于此刻帝国正遭到外敌威胁，需要每一位忠心耿耿的士兵奋起而战。辻政信可以免于切腹，西北军也被慷慨地赠予了一次将功补过的机会……\n£gezifu £gezifu 念及天皇的慈悲，辻政信不禁长出了口气。或许大陆再次兴起的战端已经彻底挽救了大日本帝国，令国体为之一振，天皇殿下必然已将朝中奸佞扫除。自己接下来的工作，便是再次尽到军人的本分，为帝国戍守华北。对于此事，辻政信显得胸有成竹——远征军的战士们个个都是身经百战的精英，心怀崇高的信仰。而经过数天的激战，他本人也对共党常用的渗透与伏击战术有所了解……\n£gezifu £gezifu 没了补给短缺，与情报的劣势，帝国经营数十年的华北地区，正是他再度崛起的绝佳舞台……"
  LFB_COX_nc.5.a:0"为山九仞,功亏一篑。"
