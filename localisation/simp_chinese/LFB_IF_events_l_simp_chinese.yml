  LFB_COX_nc.6.a:0"好的。"
  LFB_COX_nc.7.t:"密报"
  LFB_COX_nc.7.d:"西北战区总指挥部参阅：\n£gezifu £gezifu 在兰州解放后，我西北局第一时间组织了五批次共八百六十二名指战员前往陕北进行渗透。陕西的情况，确实与我们曾经料想的情形大相径庭，晋绥自治政府似乎并未在此建立有效的行政机构，或者说，这里曾经存在过类似包税制的粗放管理制度，但事到如今，任何形式的“统治”都已经彻底崩溃，此地陷入了彻底的无政府状态。我们走过的每一个村庄与城镇，无不陷入了一种消息闭塞的状态，他们并不知道本应统治此地的山西军阀到底发生了什么变故，而在广阔的未开发土地之上，则遍布着土匪与马贼。人们似乎尚未适应这混乱的局面，许多没法自给自足的大型聚居点，都因道路的切断而陷入到不同程度的饥荒之中。\n£gezifu £gezifu 晋绥政府在陕西北部，与蒙疆接壤地区的统治是最先崩溃的，据本地居民所说，在“和平时期”，这里就是滋生匪帮与叛乱的温床，但值此兵荒马乱之际，此处却还能维系着基本的生产秩序。当地村民普遍说，是活跃在附近的“红军”从劫匪手下保护了他们。这极大地勾起了我们的兴趣——西北局从未派遣战士来到陕北，问及党中央，他们也并未提及在此处有什么有组织的共产党活动。于是，我们派遣了一支最大规模的搜查队，携带着补给弹药，再次深入了黄土高坡。\n£gezifu £gezifu 在两周的搜索后，我们终于找到了这支失散已久的红军——事实上，由于日本帝国主义与其走狗长达十年的围剿，此时陕北的红军并没能建立任何稳固的根据地，只得以规模不足百人的“小队”进行游击战。每一支小队的活动范围十分宽广，彼此之间仅凭暗号与固定的接头点维系联络。对于晋系军阀的情况，他们知晓的并不比我们多，他们只知道就在数月前，当局还在宣传要“积极配合“日军在华北的戒严，坚决剿灭一切”危害东亚共荣“的叛乱……\n£gezifu £gezifu 在结合了各方证据后，我们得出了如下结论：晋系军阀目前已在事实上放弃了陕西地区的统治权，只有原国军将领傅作义率部驻扎于西安，维持着晋绥行署对陕西名义上的统治……"
  LFB_COX_nc.7.a:"怎么感觉这一幕有些…似曾相识？"
  LFB_COX_nc.8.t:0"日军开进陕西"
  LFB_COX_nc.8.d:0""
  LFB_COX_nc.8.a:0"好的。"
  LFB_COX_nc.9.t:"红军再度活跃"
  LFB_COX_nc.9.d:"£gezifu £gezifu “我再给你们五分钟时间，马上投降，不然我这五门炮就要开炮啦！”五门步兵炮黑漆漆的炮管正对着不远处的炮楼。\n£gezifu £gezifu 炮楼内，五十几个伪军士兵正聚在排长旁边，“要不咱们还是降了吧。”几个大头兵在人群后面叫着，大家伙身上都背着枪，排长一脸阴沉地坐在椅子上，手里的香烟燃烧着，额头渗出冷汗。旁边的督军听了这话，立刻站了起来，从枪套中拔出驳壳枪，对着排长，他知道，自己身上背着累累血债，一旦投降，下场就是被附近的泥腿子活活打死。想到这里，他又将手枪扫过人群，不过很明显，他并没有震住场，场面愈发控制不住。“啪”的一声，震耳欲聋，盖过了所有的争吵声。大家往枪响处看去，鲜红的血液洒向了地面，排长拔出的手枪正对着督军，枪口冒着一丝白烟，督军的尸体倒在地上。“全体集合，成两列队形，两只手举起步枪，向门外的共军投降。”\n£gezifu £gezifu 炮楼外，游击队员们压低身子，队长焦急地看着表，时间正一分一秒地流逝。“啪！”一枪，队员们立刻精神紧绷起来，望着不远处的炮楼，一片寂静。半分钟后，楼里的敌人举着白旗，两只手举着枪，走了出来。当最后一个士兵走出炮楼后，又是一声枪响。"
  LFB_COX_nc.9.a:"死有余辜！"
  LFB_COX_nc.10.t:"解放榆林"
  LFB_COX_nc.10.d:"£gezifu £gezifu 李二点着了烟锅，蹲在城门的一隅，叭叭叭地抽着，眉眼带笑地看着进城的红军。\n£gezifu £gezifu 说实话，他真没有想到，一切都是那么的……顺利，南边的龙大帅（他还是愿意这么叫他，尽管这习惯已经被指导员教育过不少次）居然打下了湖南，马上就要和日本鬼子干起仗来；更让他没想到的是红军——居然这么快就把辣鸡麻麻的榆林城打下来了！\n£gezifu £gezifu “这是天公在助我们哩,天上也见不得这鬼子的手段……”李二想想自己在这地界见过的畜生事情，呓语一样喃喃着，看着烟雾消散在天空中，像他刚来西北时见到的那缕绝望的炊烟。\n£gezifu £gezifu 烟抽完了，红军也快全部进城了，自己也得干活了不是？李二站起身来，拍拍屁股，走回联络站，站里面有他和地下战线同志们收集的榆林城资料和详情，对红军接收和维稳作用不小。他趿拉着鞋子，吊儿郎当地走在街上，他看见街边的商铺正在拆掉以前的膏药旗和青天白日，转头又把红旗挂了出来；他看见过街的红军被行人用敬畏的眼神打量着；他看见有小孩举着风车从红军边跑过，又被他的母亲扯了回去……\n£gezifu £gezifu 任重而道远啊……李二没奈何地想着，这榆林城里的百姓已经被军队作贱怕了，无论是哪来的军队都有种刻进骨子里的惧怕，希望我们的红军能让他们改观吧，就像我一样。\n£gezifu £gezifu “李叔！”李二听见一声大喊，随后后背被猛地一拍，“妈了个……你个小王八羔子！你给我吓死了！”李二低声恶狠狠地对着新兵蛋子嚷着；他刚刚以为出意外情况了，要不是他还想着观察到底是什么事，他就要把新兵蛋子给摔地上去！“嘿嘿，李叔，好久没见你了，街上看见你就没忍住…”新兵蛋子不好意思地笑着，李二也没了气“部队呢？你咋不跟大部队走？没组织没纪律的不怕关禁闭？”“跟连长打了报告了，他准了！诶诶李叔，你在榆林城待了有段时间了，这里日子跟我们那比怎么样？”新兵蛋子关注点明显没在他话上。\n£gezifu £gezifu “日子么……“李二想起来他一路上见的畜生事儿，再想想以前在新疆的日子，不禁痛苦地摇了摇头，但对着新兵蛋子的目光，他还是不忍心跟这个小孩子说。”这样吧，你先回部队，你李叔去办点事情，办完了带你下馆子，好好跟你说！”"
  LFB_COX_nc.10.a:"“好嘞，李叔！”"
  LFB_COX_nc.11.t:"延安，延安"
  LFB_COX_nc.11.d:"£gezifu £gezifu 毛岸英走在这处黄土大地之上。\n£gezifu £gezifu 这里是陕北，确切的说是延安城外的宝塔山。\n£gezifu £gezifu 尽管此地仍未重归安定，但毛岸英和一些老同志们还是在陕西解放后的第一时间来到了这里。\n£gezifu £gezifu 长征结束后，延安就作为中国革命澎湃搏动着的心脏，为中国的革命与抗日事业输送着血液——直到傅作义卖国求存，引日军过黄河。\n中共撤离延安前，延安地区的人口总数大约为三十五万左右，而日军攻入延安后，到今天，整个延安地区的人口都没有达到二十万。\n£gezifu £gezifu 根据在这里一直坚持到红军重返的老战士所说，直到一九五二年，日军仍然对延安和前根据地实行着严酷的军事管制。哪怕后来晋系军阀实际上接管了这些地区，残余的游击队仍然只是散兵游勇，难以连成一片。\n£gezifu £gezifu “多亏了乡亲，额们才有今天，才能跟着毛主席回来延安……”在这黄土地之上，一位五十多岁的老战士洒下了热泪。\n£gezifu £gezifu 毛岸英站在宝塔山上，看向了山下的延安城。是的，他现在做到了，从西伯利亚到远东，从黄沙之中的迪化再到战火摧残的兰州，现在他终于回到了这里，延安。\n£gezifu £gezifu 苏维埃政府目前仍然驻扎在兰州，接下来可能是要转移到新解放的华北大城市中，而毛岸英却提出要回到延安。这一决定在经过讨论后得到了一致同意。\n£gezifu £gezifu 在几个老党员的辨认下，毛主席曾经住过的窑洞被重新辨识了出来，毛岸英从没来过延安，但却没来由地熟悉。他自然而然地坐到了炕上，喃喃着：“父亲，我回来了……”\n£gezifu £gezifu 窗外，延安根据地在太阳升起的光芒之下又重新焕发了生机。\n£gezifu £gezifu 此时此刻，这颗革命的心脏再度波动在黄土高原之上，六万万同胞心中，唯有一个念头——"
  LFB_COX_nc.11.a:"“解放全中国！”"
  LFB_COX_nc.12.t:"磐石"
  LFB_COX_nc.12.d:"£gezifu £gezifu 在陕北的山坳坳里，有个小王庄。村中大约有二十多户人家，靠着苦耕，在这朔北之地顽强地度过一个个艰辛的年岁。对于这里的人们而言，外人的到来总是意味着坏事——他们多是走投无路的兵匪，或是县城里定时来收“乐捐”的铺保。\n£gezifu £gezifu 村民们并不知道山外的世界正发生着怎样的变故，但铺保已许久未来了。这天，村口的夯土墙上，突兀地站了几个兵，他们满身土灰，似乎比村口的枯树还风尘仆仆。虽然担心来人的身份，但刚刚结束了一天枯燥劳作的农人们，还是一个个地猫在窑洞口，紧盯着来人。\n£gezifu £gezifu “各位父老乡亲，额们是红军！”\n£gezifu £gezifu 一声带着浓厚陕北口音的问候，勾起了王顺西曾经在南泥湾参加军事训练的回忆，他正要起身开门，却被妻子扯住衣袖，”老王头，嫩不要命了？“\n£gezifu £gezifu ”可他们说自己是红军…“\n£gezifu £gezifu ”县里人都说，红军早就剿没了，还打着这个旗号的，不过都是些流寇。恁忘了吗？之前咱家就被骗了一半的粮食。“\n£gezifu £gezifu ”没…没有被骗。“王顺西望向窗外，血一般的残阳勾勒着几个后生的身影，他们举着面旗，从窑洞里并看不明晰，”他们只不过遇到了困难…革命总会遇到困难，但一定会胜利…这是毛主席说的…”\n£gezifu £gezifu “哎！额真是倒了大霉，嫁给了恁这破落户…手脚勤是勤，就是被共产党惑了去…额不管你了，恁就去吧，就是别打咱过冬粮的主意。”妻子松开了手，冲进厨房间，拉上了闩。\n£gezifu £gezifu 王顺西跌跌撞撞地走出了门，北风吹得他的脸辣辣地疼，他望向身后，发现窑洞中的目光都直直盯着他——村人们都在等，看村里有名的“赤色分子“会出怎样的洋相。他望向士兵们，颤抖着问道：\n£gezifu £gezifu “恁…恁们，真是红军？共产党…的军队？”\n£gezifu £gezifu “是的，现在全国已经开始了反攻，党马上就要回到陕北了…乡亲，请你相信我们，这次我们一定会将日寇赶出中国！”\n£gezifu £gezifu 看着风中猎猎招展的红旗，再看了看红旗下挺立的士兵，他又想起了曾经。他确信他们真的是红军，十几年了，一波又一波的军队土匪从这里路过，但只有红军有这股精气神。王顺西激动地难以言语，只是拼尽全力挺直了被劳作压弯了的脊梁，敬了个标准的礼，随后从暗袋里掏出了一张纸片，“这是额的党员证，封皮太过显眼，只能丢了，但是内页额还留着……”"
  LFB_COX_nc.12.a:"“…终…终于等到你们了。”"
  LFB_COX_nc.13.t:"红军力量增长"
  LFB_COX_nc.13.d:"£gezifu £gezifu 汪组长，快下来，二鬼子们已经在来的路上了！”两个小战士一面手忙脚乱地收拾着地上的什物，一面焦急地朝着他们那站在梯子上还在写标语的组长汪诗雨叫着——伪军马上就要来这个村子“检查”了！\n可汪诗雨却不为所动：哪有把没写完的字孤零零地落在墙上的，像什么话啊！再怎么说也得把字给打扮抖擞了不是？这可把地上的两个小战士急坏了！他们的汪组长哪都好：写得一手好字，人也像字一样精神漂亮，待他们两个也很好——可就写标语死心眼！只要标语没写完，就是毛旅长下命令她也不听！他们只能对视了一眼，准备硬生生把他们的组长拖下来！\n不过好在汪诗语也知道事态紧急，只是把手上的字刷好勾了边就下了梯子，不像以前非要把整个标语写完，这时村口的小孩跑过来，说二鬼子马上就到了。两个小战士只能把糨糊桶丢掉，一个一边把汪诗语架起，朝着游击队营地猛跑…\n第二天，汪诗语又寻回那个村子，标语果然已经被二鬼子们泼掉，她没有说什么，只是拿上老乡藏起来的糨糊桶，又站上了梯子。\n不一会，太阳拔开了云雾，毫无暖意的阳光笼在汪诗语身上，小战士拧着眉毛，结结巴巴地读看墙上刷了一半的标语，他们看了看组长高悬着的手臂，石灰水正附在皮肤上，顺着胳膊往袖口里钻…他们的眉毛更是拧成了一团……\n这些标语已经随着红军游击队的行军如天花一般爆发在晋鲁两省各地，村公所的门柱上，农舍的墙上，甚至是城墙的皮上。到处都能看见游击队的标语。“和平军”们不断地泼，刮，拆掉这些标语，可标语之后又会像经了春风的花一般，继续盛开在各处墙面上。游击队和他们的标语组像雷雨一般，来也快去更快，可墙上的标语又无时无刻提醒你他们来过。政务委员会的日本顾问气得暴跳如雷又无可奈何。已经有越来越多的人受了这些“妖语”的蛊惑了！\n但汪诗语不在乎日本人的感受，她现在只在手墙上的标语。石水已经不会流进她的袖管了，她高悬的右手腕已经扎上了一条白毛巾。"
  LFB_COX_nc.13.a:"那是村里的老乡们送她的。"
  LFB_COX_nc.14.t:"西北军残军袭扰"
  LFB_COX_nc.14.d:"£gezifu £gezifu 辻政信的死去宣告着西北方面军的覆灭，兰州被攻下，人民被解放，汉奸被清算……日本人所谓的”共荣圈“的西北之盾，就这样被赤潮冲散。随着原西北军的军部被红军的陕西事务委员会用作办公场地，西北军就此被红军画上了句号。\n\n西北军已死，但它的士兵还活着，他们四散而逃，涌进了陕西，并仍鱼肉着陕西的人民们……\n\n“红军军爷啊——恁一定要为额们父老乡亲做主啊——”张营长看着跪在自己面前哭天抢地，还不住磕头，一口一个军爷的年轻人，攥紧了拳头——“那些日本的鬼子啊，不是说红军把他们打跑了，咋又来了啊，昨天，就昨天！他们来额们村子里，要额们把粮食都交出来！额村长不同意，说额们也没余粮——那鬼子直接一枪托把额村长砸翻咧！额去给额村长帮腔，也是一枪托砸过来！”张营长听到这里，手不住地颤抖起来，红军才来不久，陕西境内的日军还没有清理干净，眼前这个被打得鼻青脸肿的年轻人，已经是他这段时间来见的第三个村里被日军劫掠粮食的人了——算上没来的恐怕还更多！\n\n”然后他们就把村里每家每户的大门都砸开来，把粮食搬出来抢了走，那都是额们明年要做种子的啊！没了这些，明年怎种庄稼呢？！“那年轻人还在抽泣着，叙说着自己村子的遭遇，可赵营长已经不忍心听下去了，”陈勇！把这位同志扶下去休息，然后通知全营营连干部十分钟后开会！“是！”陈勇扶起已经上气不接下气的年轻人离开了屋子。\n\n现在屋里已经没有别人，赵营长一拳砸在桌子上。残余日军的袭扰不仅严重影响到红军在战后的秩序重建，更使陕西人民吃了二道苦！他必须把情况向上级报告，不能再这样下去了……"
  LFB_COX_nc.14.a:"必须在陕西对日军进行彻底的清算！"
  LFB_COX_nc.15.t:"落幕"
  LFB_COX_nc.15.d:"在被红军包围十余天后，固守西安的军队终于再也支持不住了。尽管傅作义耗尽了手头的一切可用资源，也未能阻止兵变的蔓延。在红军的策反下，他的士兵们已经毫无战意。\n\n城破后，高岗走上了西安的街道。作为一个陕西人，他以前没少来过西安。虽然离上一次来西安已有十几年了，可当他再次来到这个地方的时候，与他十几年前的记忆相比，西安的一切并没有太大变化。依旧是蒙尘的房屋，老旧的石板路，菜色的行人……除了几栋日本人修的公馆与新建的工厂，满目仍是萧条破败，仿佛二十年前的战争从未真正的结束。\n\n就在昨天，他刚主持完傅作义的公审大会，他本是想着留傅作义一命，日后也好做例子劝降。可是陕北的老红军们并没有忘记，是傅作义突然倒戈引来了日军，才令陕北根据地陷落，无数优秀同志惨死他乡；西安的人民也没有忘记他在日本人面前是怎样的卑躬屈膝，在汹涌的民意之下，傅作义被判处了死刑。\n\n“我所作的，全都是为了保存实力，以待时机……”\n\n“等什么时机，你个老鳖孙，怕是你根本没料到，日本人会捅你腚眼子吧！”傅作义曾经的士兵带头反驳，引起了台下耻笑的声浪。最后是红军出面，才勉强维持了秩序。\n\n傅作义附和着苦笑——不知此刻众叛亲离的场景是否是老天对自己数次背叛的嘲弄？这之后，他便放弃了出言为自己辩护，安静地走向了死亡。傅作义虽死，可陕北的红军，陕西的人民却永远忘不了他给他们造成的苦难，他注定要以一个汉奸的身份，被钉上民族的耻辱柱了。\n\n高岗来到傅作义在西安搭建的“临时司令部”前，站岗的两位红军向他敬礼，他微微颔首，走了进去，来到了傅作义的办公室。\n\n一把高档的酒红色皮椅彰显着不同于一般军阀的品位，在桌子一侧，摆着他好不容易从山西捎来的半瓶汾酒。无处不在的浮华气息，让闻惯了黄土味的高岗感到无所适从。还是换个地方吧，他暗自思忖着。现在西安的状况可不容乐观，他还有一大堆的事情要做，陕西要作为之后反攻日寇的前线，他高岗要操劳的事情不比在陕北窑洞里时少。可还有一件好事，高岗想着，取下他那副断了一只镜腿，拿绳子拴着的破眼镜……"
  LFB_COX_nc.15.a:"他起码能换副眼镜了。"
  LFB_COX_nc.16.t:"光复秦晋特刊"
  LFB_COX_nc.16.d:"£gezifu £gezifu £gezifu £gezifu 《大公报》抗战特别增刊\n£gezifu £gezifu £gezifu £gezifu 陕西省光复已定！\n同胞们，想必你们已经听说，近些日来，我们取得了越来越大的胜利。长江两岸已基本光复，日寇的声势已极大地衰减。但抗战的前途并未明朗，据接受本报采访的某护国军高级将领（因保密之故，具体番号与姓名暂不公布）所言，华北将是一块难啃的硬骨头，保守估计，抗战仍将持续两三年的时间……一切爱国的人民应当继续紧密团结在南京抗日政府周围，积极检举身边的汉奸与敌特分子…\n\n但我们也要正式宣布一个振奋人心的消息——经过磋商，第三十五军军长傅作义已正式宣布陕西省将加入抗日的阵营。傅作义并已深刻反思之前与日本帝国主义的合作行为，并承认现昆明国民政府为“中国唯一的合法政府”，愿意服从国民政府的判决。下面将刊登国民政府允许公布的部分《关于改组晋陕行政公署、撤销绥远行政区的公告》：\n一、撤销晋陕行政公署，分别成立陕西省、山西省。傅作义暂时任陕西省省长。\n二、解散晋陕国民军，成立国民革命军第第十三集团军。军队指挥权交由南京政府军事委员会统一管理。\n三、原行政公署人员暂时留用，只清算其中的亲日顽固派。\n四、在“一切以抗战为优先，驱逐日寇还我河山。”的指示下，陕西、山西两省具体的行政划分与人事任免，将在抗战胜利后的制宪会议上决定。\n\n在护国军渡过长江黄河、打进伪满洲国皇宫，赢来彻底的胜利前，同胞们，让我们畅想未来自由的中国会是什么样子。来信请寄往以下地址……"
LFB_COX_nc.16.a:"中国万岁，自由万岁！"
#蒙古
LFB_COX_nc.20.t:0"有人来投"
LFB_COX_nc.20.d:0"查干巴拉是一个外向的人，他很喜欢自己的工作。作为红军里少有的能熟练使用汉语和蒙语的干部，他被分到了新疆根据地和伪蒙疆边界的边防连当排长兼职翻译。他的老家在呼伦贝尔，当年曾经加入抗联，和日本人拼过刺刀，后来也朝德国人扔过燃烧弹。他是在贝加尔湖再次找到组织的。\n虽说名义上和蒙疆还是交战状态，但是对面的边防连可能是觉得多一事不如少一事，也可能是碍于红军的大名，不敢有什么大动作。逢年过节还会打着白旗送来酒肉，和红军聊聊天，说说以后的生计。根据地这边会蒙语的不多，于是每次有这种“外交活动”查干巴拉都会参与，虽然方言不同，但是一来二去，居然也对他们有了点感情。\n\n事情在今晚有了改变，看着冲天的火光，查干巴拉立刻命令自己的那一个排进入战斗位置，同时要求通讯兵发报到连部。但半晌过去，别说敌人的影子了，就连打过来的炮弹都没见着。\n\n查干巴拉也越发奇怪，难道他们在内斗？又过去半晌，一个眼神好的士兵突然喊道：“排长！那边有火光！”向他喊的方向过去，只能看到一群身穿军装，打着红旗的人…红旗？\n\n随着他们逐渐靠近，好像还能听到他们在喊一些蒙语，俄语，甚至水平糟糕的汉语。\n\n“Не стреляйте! Не стреляйте!Мы друзья!”（“不要开枪！不要开枪！我们是友军！”）\n\n“Битгий бууд! Битгий бууд! Бид бол холбоотон!”\n\n查干巴拉有些发怔，但是他很快回过神来，对着战士们喊道：“小张！你带着火把跟着我过来！”\n“是！”\n“小李，我们两个要是回不来！ 你就是排长了！”\n“排长！你不能去！让我带几个同志去看看吧！”\n“你少扯没用的，咱们排除了我没人会蒙古话，我不去没人能去！小张！快来！”\n\n夜幕中，两个人，一人一支火把艰难地前进着，时不时停下来，听着周围的风吹草动，两人悄悄把火把吹熄，在不易察觉处蹲下。看着之前的那片火光逐渐靠近。查干和小张突然站了起来，拿枪对准了他们：“Битгий хөдөл! Гараа өргө!”“不许动！举起手来！”夜色中，查干巴拉和小张与这支不明来路的人相互对峙。但是对方却没有要冲突的意思，反而是哭着走了过来。"
LFB_COX_nc.20.a:0"эцэст нь чамайг оллоо!（可算是找到你们了！）"
LFB_COX_nc.21.t:0"总得有人负责"
LFB_COX_nc.21.d:0"雷政委第一次觉得这条路这么难走。\n\n好事不出门，坏事传千里。几天前边境冲突的事情已经传遍了全师，兄弟部队和上级首长的电话接了好几茬，现在团长已经拿着简报去师部了。而雷政委则赶去冲突发生的地点进一步了解情况。\n本来零星的冲突是很正常的，但是一个连的驻地上突然多出来了一个营的人就不正常了。\n\n“希望那个查干巴拉别给我惹麻烦。要是策反了伪蒙的军队还好，要是收容了那里的败军…天知道他们是什么人！”\n\n来到连部，雷政委先看到三连的连长，然后又看到一旁坐立不安的查干巴拉。\n“查干！你又给我惹什么祸了？”\n“政委！我可没给您闯祸！”\n “还说没给我闯祸！现在你抓俘虏的事情全师都知道了！”\n“雷政委！您还没有了解情况！他们不是俘虏！”\n“不是俘虏？那他们是什么人？”\n“他们是蒙古人民军！”\n\n原来在五十年代的失败后，蒙古人民军靠着靠着蒙古高原的丘陵站稳了脚跟，依靠缴获的枪弹与苏联远东政府的援助，一度挡住了伪蒙疆的兵锋。可好景不长，随着中国战场的战事结束，腾出手的共荣圈对蒙古革命展开了围剿。在日军不惜成本的直升机巡飞战术下，游击战的效果大不如前。在空旷的戈壁上，没有树木的掩护，被发现的游击队员就是活靶子。他们只能被压缩在西部的高原和荒漠中苟且偷生，直到几年前，蒙古高原西部滚滚翻涌的革命浪潮让他们看到了希望。\n“第二次全面抗战的爆发再次给了他们希望。” 查干继续说道：“随着日军的收缩，现在蒙古境内人心浮动，但多年来，他们的损失确实不小，再加上现在远东方面旧的苏联政府已经被推翻，已经没有人可以支援他们了……”\n”所以他们就一路走到了新疆？“\n“是的，政委同志，他们一到我们就给他们缴了枪，但是他们也不抵触，就乐呵呵地把枪给我们了，说什么看见红星就放心了。我和他们营长谈了谈，他说这个营只是他们的先头部队。如果算上全部能召集的离散部队，大概有一个半师。"
LFB_COX_nc.21.a:0"“这大概算是蒙古版的长征？”"
LFB_COX_nc.22.t:0"总得有人贡献"
LFB_COX_nc.22.d:0"两人来到屋外，此时屋外已经挤满了人民军的兵，带头的敬了个军礼，说道：“Би бол МБНЭ-ийн 1-р армийн 1-р морьт дивизийн тагнуулын батальоны захирагч Эргонидорж， бүх батальон командлагчийн удирдлага дор ажилладаг.” \n查干对着政委开始翻译：“他说：我是蒙古人民军第一军第一骑兵师侦察营营长额尔哥尼多尔济，全营听首长的指挥。”\n政委点点头，对着查干说：“这样，我说一句你翻译一句。”\n“蒙古人民军的同志们！你们辛苦了！”\n“Монгол ардын армийн нөхдүүд ээ! Та шаргуу ажилласан”\n “同志们的情况，我已经了解了，我很快就会报告给根据地中央。”\n“Би нөхдүүдийн нөхцөл байдлын талаар мэдсэн бөгөөд удахгүй ЗХУ-ын Төв Хороонд мэдээлэх болно.”\n“根据地很快会给你们提供驻地和训练场所，你们可以先给人民军的指挥官发报，报个平安。”\n“Зөвлөлтийн нутаг удахгүй гарнизон， бэлтгэлийн байраар хангана.Эхлээд ардын армийн командлагч руу тайтгарал илгээж， аюулгүй болсон тухайгаа мэдэгдээрэй.”\n“Маш сайн（太好了）”\n“Миний зөв（我就说来对了）”\n“бид дэмий явсангүй（咱们没白走）”\n人民军的漫漫长路终于走到了头，连部的空气也变得快活了起来。\n“那么大家现在还有没有什么急切的愿望？你们既是友人，也是客人，只要是合理的要求，我雷志成一定尽力满足。”\n这句话让在场的所有人民军都安静了下来，刚刚快活的空气荡然无存，他们的脸上都没了生气，甚至有几个年轻的士兵在轻声哭泣。\n“查干，这是怎么了？我说错什么话了吗？”\n“政委同志，您没说错，只是…”"
LFB_COX_nc.22.a:0" “他们想回家。”"
LFB_COX_nc.23.t:0"蒙古解放阵线建立"
LFB_COX_nc.23.d:0"“丹巴同志，在这里住得还习惯吗？”\n“还好吧，毛同志。住在这里至少比在草原上游击时担惊受怕好多了。”\n\n边境冲突之后已经过去了好几个月，越来越多的蒙古人民军来到了新疆根据地。而最近，蒙古人民委员会主席达西·丹巴也来到了这里，显然是有要事相商。\n\n这天，毛岸英带着外交人员来到了丹巴的住处，尽管他们从未见过面。但是抗日的共同语言让两人很快熟络到了一起。\n\n“丹巴同志，我这次来，我这次来是想与你讨论讨论接下来在蒙古地区的行动规划。”毛岸英将文件递给丹巴，“毕竟我们都知道，离乡的感觉并不好受。”\n\n丹巴接过文件，细细阅读起来。文件大体内容是关于人民军与红军的军事合作与联合作战……对于外蒙古的主权问题则只是提了句日后再议。丹巴叹了口气，显然他对于这种模糊的说辞并不太满意，回去以后跟国内的那帮从苏联回来的家伙又有的扯皮了。但当下蒙古民族的解放事业更为要紧，如果不能赶走日本人与他们的走狗，那么任何商定未来的协议内容都只能是空谈。因此，他没有提出异议，而是让毛岸英继续说下去。\n\n“我们目前的打算。”毛岸英开始讲起接下来的军事部署。“是在准备完成之后开始渗透起蒙古的工作，至于目标，则是控制大部分与我方根据地接壤的蒙古地区，最好能到达乌兰巴托。为此，我方将提供一切可能的帮助，包括人员、装备和训练。”\n\n丹巴点了点头：“那就麻烦您了。”"
LFB_COX_nc.23.a:0"Да здравствует революция！（革命万岁！）"
LFB_NC_MEN_tt: "我们将能够通过决议支持§V蒙古革命§!！\n蒙古的革命者们将会视时机发动§V革命§!，在草原上§G牵制敌军§!，但他们的力量§R不足以直接参与第二次抗日战争§!。"
LFB_COX_nc.24.t:0"蒙古人民革命党告乌兰巴托同胞书"
LFB_COX_nc.24.d:0"同胞们！自我们从清朝的帝国主义中独立以来，这座城市经受了多少苦难！这座城市的居民永远不会忘记1921年时，我们是如何团结起来，赶走了反动的博克多汗和他的走狗恩琴男爵。也不会忘记后来德国法西斯和日本法西斯发动战争时，蒙古的军民是如何保卫他们的国家的。虽然我们暂时被日本人击败，但是蒙古人民不会向任何帝国主义屈服！我们永远是自由的！有的人或许会说：在日本人的治下过活吧，因为这样好过再次燃起战火。相信这句话的人，看看乌兰巴托城吧，这座城市的哪一处地方没有被日本人控制？哪一分钱财没有被日本人榨取？他们穷尽每一种方法，将蒙古的所剩无几的财富榨得一干二净。正如旧时代的贵族和喇嘛！自由的蒙古不会忍受这样的屈辱！\n\n面对这样的情况，蒙古人民和世界上其他千千万万受到法西斯压迫的人民一样！因为这座城市是英雄的城市，城市的人民是英雄的人民！他们永远记得乌兰巴托(即“红色英雄城”）的含义，并且亲身实践它！或许有人觉得，日本人太强大了，我们永远无法战胜他们。但是恩琴男爵在我们头上作威作福的时候，也有人这么说过，他的下场如何呢？难道不是被俄罗斯和蒙古人民的团结所击败了吗？还有曾经统治蒙古的徐树铮，不也被中国的五四运动打下台了吗？如此看来，总有一天，日本人也会像历史上一切侵略者一样，得到他们应有的惩罚！"
LFB_COX_nc.24.a:0"总有一天，总有一天…！"
COX_NC_MEN_revolution:0"蒙古革命"
COX_NC_MEN_revolution_desc:0"\n\n\n日本对亚洲各国压迫的形式迥异，但残虐程度却有过之而无不及。十年前，在蒙古高原西侧，生性自由的当地人民曾掀起过规模浩大的抵抗；但彼时的日寇正值如日中天，而蒙古人民军除了图瓦的俄罗斯友军之外别无其他增援。在那时，蒙人阵几乎被完全歼灭，但即便如此，草原上的抵抗却从未终止。人民军的残部在边陲之地一边放牧牛羊，一边袭扰敌军后方，一度给日寇造成了不小的压力；但随时间推移，日军逐渐巩固了防御，在他们直升机部队日夜不停的巡逻下，蒙人阵的活动范围也被压制在了边境的贫瘠之地。\n现如今，随着中原战端再起，日军的注意力也从蒙古转移，这给了我们蒙古同志们一个宝贵的机会。尽管我们的大部队难以直接参与在蒙古草原的战斗，我们仍然可以尽力协助蒙古本土的同志，他们将开辟另一条战线，牵制伪政权的兵力，并成为我们北方战线上珍贵的盟友。\n由于地势险峻，交通不便，我们并无法获取有关当地局势的详细信息；尽管如此，我们还是通过零散的渠道拼凑出现状的概况：\n\n蒙人阵现在[Get_LFB_NC_MEN_state]"
LFB_NC_MEN_weak:0"§R尚未从战败的阴影中走出§!，倘若革命现在爆发，他们仓促组建的部队将难以有效对抗伪蒙政权。"
LFB_NC_MEN_mid:0"§Y正枕戈待旦，厉兵秣马§!，足以在革命爆发后向伪蒙政权发动凌厉的攻势。"
LFB_NC_MEN_strong:0"§G为即将到来的革命做出了万全准备§!，他们将会摧枯拉朽地给予伪蒙政权沉重打击。"
#风味事件
 LFB_COX_IF_foc.1.t: "贼，兵，战士"
 LFB_COX_IF_foc.1.desc: "老刘拉开枪栓，用毛刷轻轻扫去枪机上的燃灰。\n\n看向天际泛起的鱼肚白，他不禁想起自己在西北闯荡的二十多个年头。\n\n他并不是西北人，他的老家在山东，在日本人的刺刀下，他还没长到能咬动煎饼的年纪就被自己的爹捆在背上一路西逃，一直到西安才落脚。但他们这些流民的逃亡怎能快过日军的推进？不到一年，日本人就杀到了西安城下。趁着城中大火，十四岁的老刘从城墙根的狗洞钻了出去，一路跑进山里。跌跌撞撞，幸好最后找到个土匪窝。土匪们见他没了爹娘，便将他收留了。\n\n平日里，土匪打家劫舍，他就拿根棍跟在后面。日本人在打下重庆后，开始发了疯地加强对陕西的扫荡。在装备精良的日军面前，乱军和土匪自然不是对手。小刘远远望着营地方向高高飘起的黑烟，把步枪甩进土坑里，转头向北方奔去。他混进难民队伍，辗转了一年有余，最终拐进了马鸿逵的地界，马鸿逵给他发了一把汉阳造，让他和几个年龄相仿的新兵一起站在边境。虽然吃的仍是野菜和喂猪的糠，但至少有个安稳睡觉的地方。\n\n战后的年头平静如水，马家军间本就鲜有内斗，在战争结束后，像他这样的士兵就没了用武之地。好在这些年间，他已经从一个懵懂的娃娃成长为一个油滑的兵痞，也练就了以假乱真的西北口音，每当饷银不足以果腹时，他总能找到法子，从和他命运相仿的人们身上找补回来。\n\n再后来，日本人的坦克碾过了省界线，兰州在顷刻间失守，十万马家军片刻间土崩瓦解。他再次幸运地逃过一劫，被溃军裹挟着逃向青海。\n\n在青海的混乱中，他操起了自己的老本行，在溃军与土匪的夹缝之间，凭着那把老枪夺得糊口的粮食……生存将他逼成了一名神枪手，他的子弹能命中高飞的候鸟，但他每次扣动扳机前，都要这样犹豫片刻——日本人夺走了他的家园，害死了他的亲人，如今又令他半生的拼搏化为乌有。但他为何要不断地将枪口指向自己的同胞？\n\n随着青海秩序的恢复，老刘终于意识到劫道并不是长久的营生。于是他加入了马惇靖的部队，再一次站在了与日军对峙的前线…….朝阳徐徐升起，起床号已经吹响。看着准星中的日军斥候，老刘对自己说——"
 LFB_COX_IF_foc.1.a: "“这一次，一定要让真正的混球伏诛。”"
 LFB_COX_IF_foc.2.t: "在后方"
 LFB_COX_IF_foc.2.desc: "“欸！那边赶快！火车马上要发车了！老李动作快点！别到时候火车开了下不了车，给你送前线去！”\n\n新疆站台上，张麻子已经脱掉了上衣，把衣服跟毛巾一样挂在肩上，声嘶力竭地指挥着他们第一批运向前线的武器装载。”快点快点，别误了点，别让前线的他们没得武器用，看我们这边的笑话！“\n\n对日开战的消息刚传到厂里，工人们便炸开了锅，逃荒来的人们铭记着鬼子的暴行，而厂里的老工人也记得盛世才时代卑躬屈膝的模样，受苦受难多年，报仇雪恨在今朝！当天跑去报名参军的就有不少，几天后就戴上大红花热热闹闹地走了，送行的时候，整个厂子沉浸在热情的海洋里。\n\n但是等到送行第二天，厂里面剩下的人望着空旷许多的车间，发现了一个尴尬的事实——工友当兵倒是积极，可产线上就没人了！前线马上就要开战了，他们可不能产不出装备，让前线用不上新疆的枪！有什么办法呢？一开始就是加班加点地干，一个人当成两个人来使，但是终究不是长久之计，人又不是机器，出了问题能换个零件完事，于是厂长又把全厂人召集起来开了个会，号召同志们为了提高生产效率动动脑子，虽然大伙们的主意大多天马行空的，但还是有几个能用的点子。加上机械学校有一批学生来厂子里实习，堪堪补上了人手缺口，总算赶在计划内的时间产够了量，送到站台上准备送上前线。\n\n“麻子哥”\n\n“咋了？你的货装完了没来找我？”张麻子一转头，是来厂里实习的学生麦尔丹，麦尔丹抿抿嘴“装完了，就是……”\n\n“就是啥啊？麦尔丹你个大男人能不能有话直说”\n\n“我说我同学好多都参军打日本鬼子去了，一想到他们能在战场上用我们造的枪打鬼子我只能待在后方我心里面膈应……"\n\n”别说你，我开始都有些膈应……”张麻子把一只手拍在小麦尔丹肩膀上面，“我报名的时候去晚了，登记处的同志们说报满了，不准我登记。当时我那个心里面难受的啊……他们走前喜气洋洋的，我就闷着生产，可他们一走，我发现厂子里面空了不少，差点整个厂子都没能生产，这会我就想通了。有人在前线拿枪打仗，就得有人在后方造打仗的枪，他们在前线打仗，光荣；我们在后方保障他们的装备，一样的光荣，说不定你那些同学回来，还得来谢你呢……”\n\n麦尔丹皱了皱眉，正在低头思考，张麻子却走开了，扯着嗓子大吼："
 LFB_COX_IF_foc.2.a: "“都装完了没？！要发车了啊！”"
 LFB_COX_IF_foc.3.t: "在农村"
 LFB_COX_IF_foc.3.desc: "土改前，赛买提本是租种一小片地的佃农。虽不似农奴般完全被当作牲畜对待，却也只能仰赖巴依老爷的脸色，苦兮兮地过日子。与万千新疆农民的命运相同，他原先望不到头的苦难日子，在轰轰烈烈的土改中走到了尽头。他分到了自己的地，收了好几遭的麦子，小小的谷仓渐渐有了积蓄，孩子们脸上也有了光泽。虽然自己的生活确实越过越滋润，但赛买提仍未认同共产党人的理念，像个市侩的小商人，始终留着个心眼。\n\n今天又是交粮的日子，在旧时，政府将税收指标摊派给各地的老爷，他们便翻出泛黄的账，挨家挨户地催着税和捐。税的名目更是繁杂，什么“山林税”，“水利捐”，“管理费”……整个村子无论贫富，就算是路上的一只瘦狗，都得挨一身活剐。在这一天，每个人都愁眉苦脸，不知不幸是否会降临在自己头上。但共产党废了一切苛捐杂税，代之以最高三成的田亩税，对于穷人来说，不仅远远收不到三成，有时还会视收成好坏发放一定的补助。所以人们不仅不抗拒，往往还争先恐后地赶到设立在村子边缘的税务站。\n\n“抗战捐…钱同志，你可别诓我们啊，怎么好端端地又得多交一笔税？”当赛买提扛着一小袋麦来到税务站时，那里早已被吵嚷着的人群围得水泄不通。\n\n“抗战捐，顾名思义，就是支援抗日战争的。”听到又和日本开战了，村民们马上七嘴八舌了起来。这座南疆小村中很少有汉人落户，对上一次战争的记忆并不深刻，抗日热情相较北疆或青海也自然要弱上许多。“不过这个‘捐’不是‘捐税’的‘捐’，而是‘捐赠’的意思。凡是积极支援抗战的，都是国家的功臣，政府都会给切实的好处，等仗打完了，就给他免三年的税……”\n\n话音刚落，有的村民便要奔回家去。分地数年，每家每户都多少积了余粮，此时交出，便能在将来获得更大的益处，这笔帐，农民们当然算得清。“等等！”赛买提突然出声，喝住了几个跑在前面的村民，“就这样把自己一家保命的粮食给他们，你们就不怕他们这个理由是编的？”\n\n农民们相视一笑，说道："
 LFB_COX_IF_foc.3.a: "“他们是共产党，又不是巴依老爷，还能骗我们不成？”"
 LFB_COX_IF_foc.4.t: "袭扰"
 LFB_COX_IF_foc.4.desc: "“为什么好端端的，忽然就要打仗了？”宗田友江坐在火车上，神态有些局促，心里如此想到。\n\n帝国军队曾经威压四海，荡平东亚。但曾经的帝国军队强，和他有啥关系？他不过是因为破产了才想着进军队混口饭吃。毕竟帝国承平已久，也没有打大型战争的需要，军队是个不错的混日子地方。\n\n但怎么忽然就要打仗了呢？\n\n宗田友江擦了擦自己额头的冷汗，一想到这列火车就要开往山西，去前线真刀真枪干仗，他就忧心忡忡。“天照大神保佑，让我能够安稳回家。”他在心里默念道。\n\n“宗田你小子怕什么？”一旁的士兵看到宗田的样子，不禁哈哈大笑道：“难道你觉得那群拿着棒子的农民敌得过伟大的帝国军队？”\n\n“来到中国我就觉得很难受，那些本地人看我们的眼神怪怪的。”宗田友江想起了自己在北平换乘火车的时候，看到的一些北平铁路工人的眼神。浑身就不自在。\n\n那些眼神好像要把宗田友江杀了似的，让他不寒而栗。\n\n“哈？你这小子是怕了吧，绝对是怕了吧？”那个士兵听到宗田友江说的话，忍不住笑道：“这里是中华民国，帝国的狗！这里的人都是帝国的狗，难道你会因为狗的眼神可怕就担心狗会杀了你？”\n\n宗田友江缩了缩脖子，随口应和了一句：“是这样的……”\n\n话音未落，他忽然听到了一声巨大的爆炸声。\n\n巨大的爆炸声让他的耳朵瞬间耳鸣，隐约间，他听到了长官的咆哮“哪个混蛋…….负责…….铁……维护！！！”\n\n“长官，好像……中国人……”\n\n“混蛋……你们…….不维护？？”\n\n更多的话语他听不清了，因为他感觉自己在逐渐上天……不，是大半截火车上天了……"
 LFB_COX_IF_foc.4.a: "铁路工人出奇兵。"
 LFB_COX_IF_foc.5.t: "新战争"
 LFB_COX_IF_foc.5.desc: "“唉，鬼子们真是越来越猖狂了……隔三岔五来一次，护村队的那几杆老枪根本敌不过……”驻村的红军战士董善闷闷地抽着烟，一根烟抽尽了，被他扔在地上踩灭：“当年在俄罗斯的时候穷是穷，哪这么憋屈过……”\n\n“咋好好的生闷气呢？”董善扭头一看，是村子里的老孔，“哪怕只是鬼子的一支小队，我们也拿他们没办法，只能躲，等走了喘口气，顶多零星给他们搞点破坏，憋屈啊……"\n\n“这有啥嘛，我听你们的那个指导员说，这不就是游击队的任务嘛。”\n\n“可就这样也没多少实质成果啊，这儿打一枪，哪儿丢个炸弹，根本就打不死几个人！把鬼子逼急了，就叫来直升机，突突突一阵扫荡，我们的战士反倒不好藏。鬼子太猖狂了，一点消停下来的迹象都没有！“\n\n“唉，你脑子里环环多，我说不了你，”老孔望着天，若有所思：“但牵制的办法嘛……我这倒有一个，我爹跟我讲的，说是以前八路军用的。”\n\n“这都多少年过去了，能管用？”"
 LFB_COX_IF_foc.5.a: "“试试嘛，鬼子那么嚣张，说不定能奏效……”"
 LFB_COX_IF_foc.6.t: "老办法"
 LFB_COX_IF_foc.6.desc: "堀村章男跟随着部队行进在华北的乡间，进行着日军的“定期巡查”。自从华北戒严后，这样的巡查便越来越频繁了。即便华北军与日军共同编织了天罗地网，抗日势力却像恶性肿瘤般向整个华北蔓延，令指挥部不得不加派了巡逻的人手，用日军替换战斗能力不佳的华北军。堀村章男已经连续数周没有半天歇息，每天的生活尽是长途跋涉——无论是乘车还是步行，都是对身心的煎熬——巡行在华北的各个村子，寻找任何“反日分子”的蛛丝马迹。\n\n自华北大戒严后，许多农村人彻底断了生计，走过一个个村子，堀村章男明显地感觉到，人们对他们的态度越来越冷淡。紧接着的，是上级命令“检查”的次数越来越多，搞得大家都唉声叹气——虽然那些“反日分子”手中低劣的武装很少能威胁到训练有素的皇军，但谁愿意有事没事风餐露宿，一天到晚荷枪实弹，走在这种路上？\n\n“前方发现反日分子，全队，追击！”堀村章男正出神，突然被长官的喊叫惊过来，发现“反日分子”？追！他立即迈开脚步，与队友一起跑起来。他们根本不熟悉这里的地形，那些“反日分子”腾挪数次便不见了踪影。堀村章男正泄气，突然一声枪响传来——“敌袭！警戒！”他立马和队友配合，按照训练科目警戒起来，可那枪声只一下便没再继续，“闹鬼了？”堀村章男想着——“砰！”又是枪响！并且这次的枪响连续不断，“在那里！”小队长反应过来，乒乒乓乓的看样子人不少，于是他将队伍分作两队，带着一队前去追击，留一队原地警戒。堀村章男跟着小队长追击。“砰-砰-砰”枪声越来越近，有几发子弹甚至呼呼地掠过堀村章男的耳朵，可当他们赶到时，人已经跑掉了，只留下一地弹壳。小队长暴跳如雷，发誓要——“砰！“枪响！是留守警戒的地方！他们又往回赶，可晚了，堀村章男所看见的，只有留守队友的尸体！\n\n“哎呀，这鬼子的烟，是要得劲得多。”董善美滋滋地抽着今天袭击从鬼子身上搜刮的香烟，长长地出了口气。“你这下不生闷气了吧？”老孔坐在他旁边，笑着说到。”哪能呢？我说老孔，你给的这土方法真不赖！”\n\n“那可不，”老孔还是望起了天，“这方法听我爹说，是一个八路军给我爹讲的，他后面牺牲了，就埋在我们村，当时怕鬼子啊，碑都没敢立一个，现在都不知道坟在哪里。他要是看见今天我们用他讲的方法，也会高兴的……""
 LFB_COX_IF_foc.6.a: ""今天就当给他扫坟了。""
 LFB_COX_IF_foc.7.t: "补给线"
 LFB_COX_IF_foc.7.desc: "黄沙满天，路途漫漫。\n\n买买提·艾山本是位南疆的农民，但是在家乡土地改革后，他也从世代劳苦的宿命中逃了出来，共产党在新疆搞了拖拉机，在各个农区设置了拖拉机站，买买提抓住机会，去拖拉机站的学习班学习了怎样驾驶拖拉机。\n\n这几年过去了，买买提的生活改善了很多，他感谢共产党，也因对马克思主义理想的追求入了党，而就在前几天，买买提听从党的号召，加入了抗日的大队伍中。但是，他擅长什么呢？买买提不会拿枪，但是会开拖拉机！\n\n“老领导，开拖拉机呢嘛我这个可以，我学学开车呢就很快的。”买买提用刚学的汉语说到。\n\n“买买提同志，组织上也非常欣赏你，你的学习能力也是大家认可的，那你就加入我们新组建的卡车队，给前线的将士们送枪杆子如何？”领导轻轻拍了拍他的肩，用维语回复道。\n\n买买提本来以为青海的路途上会有更多绿地，没想到和自己的家乡还差不了多少。从哈密出发，买买提和一位汉族同志刘少安轮换开车，平时谁醒着另一个就在副驾驶位睡着，不过也有可以聊天的时候。\n\n“你说这车子哪里来的啊，之前也没见过。”刘少安问到\n\n“这个嘛，这个东西好像从那个乌鲁木齐送过来的，他们从哈萨克那边入了撒玩意来着，什么工…”买买提在回想怎么说汉语的工业产线\n\n“工业产线？”刘少安说到\n\n“啊对对！就内个东西，还有一批卡车从俄罗斯人那买的。”买买提继续开着车，看着前方的天空，好像有什么鸟一样的东西。\n\n“同志，你看看那边那个，是个撒东西。”买买提问道。\n“是敌机，买买提，快快快，把方向盘朝左打！”\n\n一个油门过去，卡车窜到一旁的石头后面，巨石投下的阴影堪堪遮蔽了他们的踪迹，买买提与刘少安连忙翻下车去，从车斗后拽出沙色的网，将珍贵的物资仔细盖住。\n\n飞机低空盘旋了一阵，远远地丢下几枚炸弹，就飞走了。买买提重新将车开上了路，发现就在目力可及的前方，一缕垂烟直冲天际，片刻后，隐隐间能感觉到爆炸的声浪。刘少安紧张地盯着空中，买买提攥着方向盘的手不住地冒着汗……\n\n日机的航程终究有限，直到太阳将落的时刻，也没有第二架敌机出现了。买买提与刘少安将车开到路旁，想要小憩片刻，就在这时，他们看到了一辆卡车的残骸，正侧翻在路旁，钢铁的框架烧像炭一般黑——日机的空袭太过突然，情急之下，他们只能冒着被烧死的风险，坚守在驾驶舱内，将车开至路旁，避免将这条不宽敞的道路阻塞……\n\n驶过残骸时，买买提不禁脱帽致意，他知道，明天自己也可能化为焦骨。在这后方战线，尽管不是战士，但仍需赌上性命。"
 LFB_COX_IF_foc.7.a: "因战争时刻在身旁。"
 LFB_COX_IF_foc.8.t: "击兔伐狐"
 LFB_COX_IF_foc.8.desc: "艾克山江看着倒在自己面前的尸体。\n\n新疆的拖拉机工业依靠着从俄罗斯和中亚引进的设备迅速发展，在过去的几年间，共产政权已经在此处建立了数条生产线。而在与日本的战争爆发后，这些工厂也迅速地动员起来，转向支援军事生产。艾克山江是哈萨克逃难过来的难民，曾经就在这些工厂中工作过，结识了不少人脉。\n\n在暗地里，艾克山江却一直对控制当地的政权心怀芥蒂。他放不下与当地中国人之间的隔阂，也一直不满于他这样的哈萨克人要在这里受外人统治。他新疆开始动员后没多久就撞了大运：一个神神叨叨的老头找上了他的门，邀请他来为“民族解放”的运动出力。他没怎么思考就答应了。\n\n一开始，老人让他帮忙统计一些稀松平常的数据，比如厂区的每日产出或是交货目的地。随时间推移，指令逐渐变成了拉拢工人，组织怠工或是唆使制造破坏。而随着他和这个“运动“的关系逐渐亲密，他也大概明白了：这些运动并不是凭空从地里长出来的的。偶尔他能瞥见一些蛛丝马迹：来自日本或者满洲国的支票，印有菊花纹的日语文件……很明显共产党的对手正在背后牵线搭桥。当然，对艾克山江来说，干这种事有钱拿，还能为民族事业做贡献，他不会在乎这个。\n\n这种日子持续了一段时间。最近，各处工厂开始设立夜班巡逻，工人团体也开始组织纠察防止破坏。不过艾克山江没感觉这些举措对他产生了什么威胁；如果他的线人遭到了怀疑，为了自保，他会毫不犹豫地下杀手：就像现在这样。 \n\n艾克山江面前的这具尸体曾经是个克拉玛依112厂的组装工。在过去的几个月中，这名工人在金钱的诱惑下不止一次地通过“意外”干扰了生产线，共党打着团结工人的旗号，没把他加以严惩。可在几天前，据说他晚上被巡夜班的工人发现，抓了起来，还被政委抓了起来问话。那些假仁义的共党还把他给放了——可艾克山江并不傻。以绝后患，最好现在就把他除掉。整个过程没什么波折，那慌张的工人一进小巷，脑袋上就挨了一扳手，很快断了气。\n\n艾克山江把脸遮好，开始向外走，全然不自知自己的举动其实早就引起了当地党组织的注意：几起同一地区的破坏案很快地就追溯到了他的极端民族主义案底。为了不引起日本特务机构的怀疑，人民安全局特地对他的破坏行为稍加放纵，麻痹他的警惕。到现在，当地的日本特务行动资金链已经被查清，他们勾结的反动分子也基本浮出水面，是收网的时候了。\n\n一出巷子，艾克山江就被几名红军士兵围住；在被带走的时候，他仍然没反应过来自己早就暴露了。"
 LFB_COX_IF_foc.8.a: "又一个间谍网没了。"
 LFB_COX_IF_foc.17.t: "来访"
 LFB_COX_IF_foc.17.desc:"叶剑英忙碌着。 \n\n就在数年前，龙云在云贵举起了黑天血日旗，率领着他们这些残兵败将，如同当年的蔡锷将军般，向着汉奸卖国政府发起最后的反击。那时，谁也不会想到，这帮败军之师，即将横扫整个南方，直至将南京城解放。 \n\n在当时，叶剑英和不得不栖居于北越的中共残部也追随着护国军，共同投入了这场战争。作为在国共双方都享有盛誉的抗日名将，他理所应当地被龙云邀至护国军总部，出任参谋长。 \n\n又是参谋长呵！ \n\n二十多年前，他也是陕北红军的参谋长，遥想当年，在那片贫瘠的土地上，洋溢着进步的激情，人们土改、生产、抗击敌人……但当战局日渐不利，盘踞山西的军阀转投敌方后，弱小的根据地被迫直面敌人的攻势。党中央只得按照预定的计划，踏上了新的长征，至于原先的陕北根据地，则由那些视死如归的同志们坚守着。 \n\n为了尽可能保存火种，找寻合适的地区建立新的抗日根据地，党中央几经辗转。在日寇的围追堵截下，八路军跨越了已化为废墟的中华大地，重新翻越秦岭，跨过四川盆地，队伍的规模不断减少——中共付出的惨烈代价，甚至包括那个在过去的二十年间，一次次领导全党渡过险境之人。一发流弹夺取了他的性命——就好像命运开的玩笑……当剩余的共产党人抵达云南时，党组织早已残破不堪——领导层不是走散，就是死在了半路。叶剑英怎么都没能想到，领导南方幸存者的任务，最后竟落在了他的肩上。 \n\n在北越的丛林当中，生存比战斗更艰难。丛林恶劣的环境没少让来自北方的指战员水土不服，但也为游击队的行动提供了绝佳的掩护，敌人的苛政创造了广阔的群众土壤。共产党游击队扎根于此，在二十年间，不断发展壮大。但在叶剑英的心头，始终挂念着当年留在陕北，还有失散在全国的同志们。 \n\n随着龙云发动第二次北伐战争，他的疑问终于得到了解答—— \n\n留守陕北的同志们顽强地幸存了下来，挺过了二十年间日寇与伪军的一次次围剿，在军阀匪兵的夹缝中顽强生存至今，不仅如此，当他得知整个西北都已在共产党的控制下时，几乎激动得发不出任何声音。 \n\n“叶参谋长。”这时，一个士兵敲响了他办公室的门，“龙大帅叫你去客厅一趟，说有大事要找你商量。” \n\n “好的。”"
 LFB_COX_IF_foc.17.a:"叶剑英收起自己的思绪，迈着有力的步伐，来到了客厅。"
 LFB_COX_IF_foc.18.t:"相逢"
 LFB_COX_IF_foc.18.desc:"现在的中华民国政府办公的地点，曾经是过去伪政府所用。即便来到这里已有些时日，叶剑英仍无法适应此地的奢华——只是一个会客厅，就大得简直能容得一个排在里面操练了，房顶雅致的吊灯挂着无数磨光镜片，白炽灯的光芒得以巧妙地投射至房间的每一个角落。\n\n在过去，改组国民政府的达官显贵们就在这里会见共荣圈内外的外交人员。尽管硕大的落地窗被以尽可能巧妙的角度朝庭院开放，但若是不小心翼翼地挂上窗帘，仍能从这里望见近些年城内疯狂滋长着的贫民窟。\n\n在攻下此地后，连同那遮羞布般的窗帘，护国军撤下了绝大多数的奢华装饰，龙云命人将云南自己常坐的沙发搬来——一夜之间，这里就成了中国抵抗势力的总指挥部。\n\n此刻，叶剑英看到龙云——护国军的领袖，全民族抗日精神的化身，正与一个中年人交谈。\n\n“……对此，西北人民愿竭尽所能，与贵方结成统一战线，共图民族解放之大计。”\n\n“好，好啊！”已经八十余岁的龙云仍精神矍铄地站了起来，指着面前战线犬牙交错的地图，“如你所见，尽管抗日势力遍布长江以南，但日据广东与华北仍对我方形成夹击之势，此乃中华民族最危险的时候……但如若西北诸省愿意共襄盛举，从军事上来说，漫长的华北战线将极大缓解南方的压力，从政治上来说，这更能一举奠定胜机……”\n\n西北政府？共产党？听到这些词让叶剑英有些发懵——作为得到龙云接见的特使，对方必定也是西北党组织的领导人。他本以为那将是某位德高望重的老同志，但没想到对方竟是一个他从未见过的年轻面孔。\n\n“啊，叶将军已经来了啊。”龙云朝向那个中年人，继续说道，“这位叶剑英将军，也是你们共产党的人。就是他带着云南的共产党打了二十年游击。”\n\n“久闻大名，叶剑英同志，我是西北抗日政府的领导人，毛岸英。”\n\n“毛岸英？莫非……”\n\n“是啊，自我父亲去世后，发生了许多事。但二十年过去，共产党人再次踏上了抗日的战场。二十年间，你们一直为人民而战，我都听说了……同志，你真的辛苦了。”毛岸英向这位饱经风霜的战士伸出了手。\n\n经年的疲累与伤痛似乎都在这一瞬间爆发了出来，但叶剑英忍住了自己的情绪——新生的南京与西北政府间还有许多隔阂，日寇的军事威胁迫在眉睫，时间紧迫，全中国抗日力量的联合与否，都取决于他以及西南的同志们能否在乌鲁木齐与南京之间架起桥梁。\n\n站在一旁的龙云，咧嘴笑道："
 LFB_COX_IF_foc.18.a:"“同志见面咯。”"
 LFB_COX_IF_foc_tt_18: "昔日§x同志§!§F终得重逢。"
 LFB_COX_IF_foc.19.t:"交流经验"
 LFB_COX_IF_foc.19.desc:"“碰见日本人端刺刀冲上来千万别慌，也别和他们拼刺刀，冷静下来端稳枪打就行了，他们吼里呜噜冲上来的时候基本就快输了，看着吓人实际压根冲不到跟前来…陈勇正手舞足蹈地向围着他的护国军战士们兴奋地讲解着，活像一个老师，尽管护国军士兵们大多都比他老。\n\n稍微年轻点的都全神贯注听着，有几个有文化的还在做笔记，年老的士兵们听者也暗自点头。\n\n“还有啊，上次我们班碰见几个日本残兵，我骑在马上，举起枪“啪啪”几下就给他们开了瓢！”\n\n“得了吧，勇蛋子，那就是几个青海马匪，况且那还不是你打的，是李班长打的！”路过的同班战士忍不住了，戳破了他的牛皮。\n\n周围的护国军士兵都笑了起来，“嘿嘿…那鬼子端刺刀不是李叔给我讲的？咱们后来打兰州，那些鬼子是不是就那样？”陈勇红了脸，连忙转移话题。\n\n“那倒也是…”那战友咕哝着，走远了。\n\n“小伙子，那我问问你…”一个年老的士兵开口了，“碰见过鬼子的炮楼没？碰见了怎么办？”他实在不相信这个岁数能当他孙子的小孩真打过日本人。\n\“这个嘛…”咱营长讲过嘞！先围住，围到他弹尽粮绝！不过我们现在打急了都是直接上炮轰，炮营的老经验们找谁位置，要不了多久就倒了！”\n\n“怎么可能？！你们那鸟不拉屎的地方，能有炮？！”，“我们都没几门，你们还能有炮？！”护国军们炸了锅。\n\n陈勇看着他们咋舌的样子，忍不住地得意起来，这几天看护国军惊讶的样子，已然成了他的一种享受。“因为嘛…我们是近卫八十八旅！我是新编第二营的！“近卫”听说过没？我们可是红军的精英…北边那什么花元帅给的火炮，大多数都在我们旅…”\n\n“那么说，你还打过俄罗斯人和盛世才？”一个戴眼镜的士兵发问了，近卫八十八旅的名号，他是听过的。\n\n“这倒没有…我是新疆的，新疆解放了我才参的军…”陈勇这回没吹牛皮了，“不过我们张营长可是老兵！打过的仗说不定比我李叔还多些呢！”“陈勇！暂停交流！营里集会！”张营长的声音传过来了，他对这个小伙子总能被一群人围住很惊异。\n\n“是！”陈勇喊了一声，转过身来“那哥哥伯伯们，今天就先这样吧，明天我还会来的！”他向护国军们敬了一个军礼，护国军们回礼后纷纷散去，转身走向各自的营房。\n\n陈勇抹了把头上的汗，小跑奔向营长。"
 LFB_COX_IF_foc.19.a:"殊途但同归"
 LFB_COX_IF_foc.20.t:"标语与白毛巾"
 LFB_COX_IF_foc.20.desc:"“汪组长,快下来,二鬼子们已经在来的路上了!”两个小战士一面手忙脚乱地收拾着地上的什物,一面焦急地朝着他们那站在梯子上的组长\n\n还在写标语的组长汪诗雨叫着——“和平军”马上就要来这个村子了!\n\n可汪诗雨却不为所动：哪有把没写完的字孤零零地落墙上的,像什么话啊!再怎么说也得把这个字打扮抖擞了不是?这可把地上的两个小战士急坏了!他们的汪组长哪都好:写得一手好字,人也像字一样精神漂亮,待他们两个也很好——可就写标语死心眼!只要标语没写完,就是谁下命令她也不听!他们只能对视了一眼,准备硬生生把他们的组长拖下来!\n\n不过好在汪诗雨也知道事态紧急,不像以前偏要把整个标语写完，只是把手上的字刷好勾了边就下来了,但这时村口的小孩跑过来,说“和平军”马上就到了。两个小战士只能把标语桶丢掉,一个一边把汪诗雨架起,朝着游击队营地猛跑……\n\n第二天,汪诗雨又寻回那个村子,标语果然已经被二鬼子们泼掉了,她没有说什么,只是拿上老乡藏起来的桶子,又在那个地方站上了梯子。\n\n不一会,太阳拔开了云雾,毫无暖意的阳光笼在汪诗雨上,两个小战士拧着眉毛,结结巴巴地读着墙上刷了一半的标语,他们看了看组长高悬着的手臂,石灰水正附在皮肤上,顺着胳膊往袖口里钻，他们的眉毛更是拧成了一团……\n\n这些标语已经随着红军游击队的行军如天花一般爆发在晋鲁两省各地,村公所的门柱上,农舍的墙上,甚至是城墙。“和平军”们不断地泼,刮,拆掉这些标语,可标语之后又会像经了春风的春花一般,继续盛开在墙面上。游击队和他们的标语组就像突如其来的雷雨一般,来得快去得也快,可墙上的标语又无时无刻提醒你他们来过。政务委员会的日本人气得暴跳如雷又无可奈何。已经有越来越多的人受了这些妖语的蛊惑了!\n\n但汪诗雨不在乎日本人的感受,她现在只在乎墙上的标语。石灰水已经不会流进她的袖管了,她高悬的右手腕已经扎上了一条白羊肚毛巾。"
 LFB_COX_IF_foc.20.a:"那是村里的老乡们送她的。"
 LFB_COX_IF_foc.21.t:"古国新生（其一）"
 LFB_COX_IF_foc.21.desc:"远方的黄沙遮蔽了天空，山麓被灰雾遮挡。直到太阳从云层中现形，将空气中的朦胧一扫而光。小张出神地望着远方，面前有不少的乡亲们还在陆陆续续来到今天的动员会场地。\n\n突然一声稚嫩的声音响起，小张四下张望，却看不到声音发出的源头。低头一看，正好与两只圆滚滚的大眼睛四目相对。小张啼笑皆非地说：“娃子，你爸妈呢？”小娃娃没回答他，只是将手中紧握的笔记本放在台上。小张将笔记本拿起来，本子的封面已经有点微微泛黄，印刷的字迹也有些模糊，但依稀还能辨认出封面上手写的名字：黄树生。小张看了一眼娃子，见他并没有阻止查看，便翻开了第一页。“在红军出现之前的几十年里，这片土地一直在默默地注视着这里。但今天它终于愤怒了。这片土地上的人民终于愤怒了。\n\n他们红着眼，流着泪，告别妻儿，来到一个他们从来没有去过，以后也没有机会再去的地方，这个地方离家很远很远，离死亡很近很近。因为这里是——前线。”\n\n再后面的字迹已经不可辨认，但小张已然猜到，这个笔记本的主人就是这个娃子的父亲，在写下这些话后便毅然去往了前线，从此一去不回。\n\n小张不忍心告诉娃子可能的结果，只是问：“你是要去找爸爸吗？”娃子点点头。小张看出孩子怕生，只是不停的在说要去找爸爸，遍走到他面前，蹲下来，温柔地对他说：“娃子，你的爸爸是英雄，他在我们看不见的地方守护着我们。你和你一样大的娃娃们能快乐成长，就是你的爸爸和叔叔我们期望的。好好长大，要看到革命胜利的一天，到那个时候，爸爸就会回来了。”小张说完，站起身来，从那个孩子的眼睛中，若有若无地看见了点什么。\n\n报名结束后，等到太阳落下一点，小张站起身，走向演讲台，手里拿着涂涂改改过的演讲稿，台下掌声雷动，使小张更觉得振奋起来。"
 LFB_COX_IF_foc.21.a:"“士不可以不弘毅，任重而道远。”"
 LFB_COX_IF_foc.22.t:"古国新生（其二）"
 LFB_COX_IF_foc.22.desc:"小张走上用木板临时搭成的演讲台，立到话筒前，嘶哑的端鸣声让乡亲们渐渐停止了讨论，将目光全然地汇聚到他的身上。\n\n小张扫视着台下的观众，他的动员对象。他看到了一张张灰白或蜡黄的面孔，一双双浑浊或清澈的眼睛，但无一例外都充满了渴望，渴望着他的一番话能给他们带来一条无悔的道路。他动了动喉咙，“乡亲们！”会场十分安静，就像是暴风雨前的死寂一般。\n\n“大家都听说了，我们共产党，和南边的龙云龙大帅，已经带着部队和日本人开战了。很多人都说，这是送死，这是拿着鸡蛋碰石头，但我说，是的!我们还要用我们这颗鸡蛋，把日本人的石头砸烂!小张咽了口唾沫，看向远处的政委，接着说： “在这里的乡亲们，很多并不是生在这里的人，我和你们一样!我的父亲在华北被日本人杀了，我一个人在黄土上，遭了地主的剥削、受了土匪的棍棒，流浪了多久，好不容易才找到红军，加入了他们的队伍，为我爸爸，也为我同村的乡亲们报仇!我们农民，自古以来就是面朝黄土背朝天，喝着黄河水，靠着土地过一辈子，而现在日本人来了，他们抢走了我们的土地，烧败了我们的庄稼，杀害了我们的同胞，这份仇，我们一定要报！”小张的声音哽咽了，泪水模糊了视线，他想起了他的家人，他的村庄，全部在在一场火焰中消失在记忆里，他爱的一切都在日本人的侵略中毁灭一声呐喊将他惊醒，\n\n “我们要报仇!”小张惊愕的抬起头来，才发现是台下几个群众带着大家喊了起来。“打到中原去!打跑日本人!”“保卫土地!为同胞报仇!”此起彼伏的呐喊声让小张，让在场的所有人内心充满了悸动。\n\n是啊!在这片古老的、千百年荒凉的土地上，正是这样显扬的精神让中华民族生了根，发了芽，遍布了这片家园。而日本人想要把它夺走，那就让他们尝尝沉睡着的，来自古国的愤怒呐喊!即使这份精神已经被压抑了数十年。但直至今日，它会随着根和茎破土而出，代表着觉醒的中国，挽救这片土地所有的不甘与绝望。"
 LFB_COX_IF_foc.22.a:"“士不可以不弘毅，任重而道远。”"
 LFB_COX_IF_foc.23.t:"汉奸公审大会（其一）"
 LFB_COX_IF_foc.23.desc:"北京南苑机场，一位老者在一位中年人的陪同下步入早已准备好的专车。那老者的名气不大，但是在当今的北平，没有人不知道那位中年人的名字，毛岸英。\n\n“谢老，真没想到您能这么快回来。”\n\n“中国需要我，我当然要回来。”\n\n说罢，谢觉哉又细细打量了坐在旁边的中年人。\n\n“孩子，你都已经这么大了。”\n\n“时过境迁啊，谢老。”\n\n“除了我，审判团里还有谁？”\n\n“除了您之外，还有前重庆国民政府的司法行政部部长，巴黎政法大学博士谢冠生，芝加哥大学博士，复旦大学教授梅汝璈，还有前重庆国民政府的冀朝鼎，其实是我党的秘密成员，也是芝加哥大学法学硕士。”\n\n“都是年轻人，都是大才子啊。”谢觉哉摇了摇头，“看来是用不上我这个老秀才喽。”\n\n“谢老，别看这些人都是一肚子墨水的，他们见的洋人比你多。但要是论批过的地主和写过的法案，那还是您多啊。”\n\n“哈哈哈哈，说的没错。”\n\n随着专车到达临时法院门口，车周围的记者也逐渐多了起来。\n\n“谢觉哉先生！谢觉哉先生！”\n\n“那就是中共的元老谢觉哉先生！”\n\n谢觉哉不慌不忙地在宪兵的保护下穿过人群，走上了法院门口的台阶。\n\n“谢先生！请问您会怎么判决大汉奸周佛海！”\n\n听到这番话，谢觉哉停下了脚步，转过头来面对着由摄像机架成的阵地。\n\n咔擦…咔擦…咔擦…\n\n“这位记者朋友，我首先要说…\n\n咔擦…咔擦…咔嚓…\n\n“最终的判决将由审判团决定…”\n\n咔嚓…咔擦…咔嚓…\n\n“我一个人无法代表…”\n\n咔嚓…咔嚓…咔嚓…\n\n“但是，我可以保证一点。”\n\n咔嚓…咔嚓…咔嚓…"
 LFB_COX_IF_foc.23.a:" “我绝对会给出公正的审判！”"
 LFB_COX_IF_foc.24.t:"汉奸公审大会（其二）"
 LFB_COX_IF_foc.24.desc:"“我宣布，中华民国汉奸公审大会正式开始。”\n\n“梆！”随着木槌落下，人群爆发出一阵鼓掌声。”\n\n“传，被告周佛海。”\n\n周福海穿着一身西装，平静的走到了被告席前面。\n\n“你的名字和之前的职务。”\n\n“周佛海，中华民国行政院长。”\n\n“放屁！”“你代表不了中国！”“狗汉奸！”\n\n法庭上下一时间被咒骂声所淹没。\n\n等到咒骂声慢慢停息，谢觉哉法官才开始要求大家安静。\n\n“被告周佛海，你被控告犯有汉奸罪，通敌罪，叛国罪，你是否认罪？”\n\n“我不认罪。”周福海平静地说，好像他才是法官似的。\n\n“陈述你的理由。”\n\n“法官大人，诸位记者。鄙人看来，汪先生实乃我民族史上一大伟人！若没有汪先生极力在中日之间周旋，中国将会如何呢，恐怕上海，杭州，还有这北平都要被日本人损毁殆尽了。诸位不在汪先生身边，自然不知道汪先生的良苦用心，啊，还有旁听的毛岸英主席，您当年太年轻了，实际上，如果您的父亲仍然在世，他也会同意，我可是很早就见过他…”\n\n“暂停一下，审判团已经了解了你的理由，现在要进行三十分钟的休庭，以便审判团商议你的审批结果。”\n\n说完，谢冠生便把头转向谢觉哉,说：“谢老。”\n\n谢觉哉点点头，举起了手中的锤子。\n\n“我宣布，现在休庭。”"
 LFB_COX_IF_foc.24.a:" “梆！”"
 LFB_COX_IF_foc.25.t:"汉奸公审大会（其三）"
 LFB_COX_IF_foc.25.desc:"宣布休庭后，审判团走进了会议室。\n\n谢觉哉开口道：“三位，咱们都知道，这次公审大会是通过无线电向全国实时转播的，另一方面讲，周佛海身为头号大汉奸，对他的审判不顺利的话，其他的汉奸恐怕会更加嘴硬…”\n\n梅汝璈先声夺人：“谢老，周佛海的罪行无可辩驳。而汪兆铭和他的幕僚们一直宣传“曲线救国”这样的言论用来骗人，现在只怕不是把他们自己也骗了。\n\n小谢紧随其后：“周佛海此番话语无非是有两个目的，一是继续麻痹群众，使得舆论风向摇摆，而第二个就是…”\n\n冀朝鼎：“激怒毛岸英主席和污蔑毛泽东同志。”\n\n“三位说得好啊。下一部分的庭审，我打算拿出罪证。让人民群众看看，所谓的行政院长究竟是个什么人。”\n\n半个小时转瞬即逝，威严的法官和记者们再次回到他们的位置上。\n\n“被告周佛海，你为自己辩解的理由就是曲线救国吗？”\n\n“法官大人，鄙人一向以先总统的遗志为训，所作所为…”\n\n“被告周佛海，你只需要回答是和不是！”\n\n“是的。”\n\n“那么，检方接下来将呈出被告有罪的证据。”\n\n冀朝鼎挥了挥手，一名宪兵很快把一本笔记本呈了上来。”\n\n“被告，你是否认识这本笔记本？”\n\n“认识…”\n\n“这笔记本是干什么的。”\n\n“这是…我的日记。”\n\n“他的额头在冒汗！”一位记者大声喊道\n\n咔嚓…咔嚓…咔嚓…咔嚓…咔嚓……\n\n闪光灯下的周佛海肉眼可见地变得慌张。\n\n“被告周佛海，记录表明你在一九四零年至一九四八年的清乡委员会中担任副委员长，此事属实吗？”\n\n“属实，”\n\n“你知道保安队血腥屠杀农村，搜捕抗日分子的事情吗？”\n\n“那些事都是我后来才知道的，当时我已经重新联系了军统…”\n\n“你放屁！”谢冠生已经无法忍受周佛海的虚伪了，他猛地站起来，拿着日记走到了记者们前面。\n\n“诸位记者同志们，大家都看看，这个伪君子完完全全是知道的啊！”\n\n“六月二十三日…八时，批准清乡事务…”\n\n“他骗了我们！他骗了我们二十年！”\n\n“妈的，这件事情能怪我吗？”周佛海大叫道：\n\n“要怪就怪那些苏闽浙的村民！好好的包庇红军干什么啊？抵抗干什么啊？怎么就不能好好配合东亚团结，怎么就不能…”\n\n“宪兵，宪兵！控制住他！”\n\n“肃静，肃静！”\n\n嘈杂的声音占领了整个会场，周佛海的叫喊声，群众的叫骂声，记者的快门声交织在一起！\n\n宏大的乐章往往都有响亮的结尾。\n\n“梆梆梆！”\n\n“肃静！”\n\n人群很快安静下来，因为他们知道，法官们马上就会作出对周佛海的判决。\n\n只见谢觉哉起立，宣判道：“被告周佛海，通敌罪、叛国罪、汉奸罪，罪名成立，中华民国临时法院判处被告……”"
 LFB_COX_IF_foc.25.a:" “他应当被判处死刑，这是这个汉奸应得的！”"
 LFB_COX_IF_foc.25.b:"“无期劳改！”"

#城市解放
LFB_GAW_GUI.102.t: "黄河明珠之殇"
LFB_GAW_GUI.102.d: "兰州市，简称“兰”“皋”，古称金城。地处西北要地，兰州自秦朝以来已有两千多年的建城史，自古就是“联络四域、襟带万里”的交通枢纽和军事要塞。日本远征军占领这里后，辻政信更敏锐地觉察到了此地的战略价值，不远万里从满洲拉来钢筋水泥，就地征调民夫，将兰州城内外围成了名副其实的铁桶。\n\n但无论怎样牢靠的工事，都有其弱点。随着战争的旷日持久，辻政信越来越难以给远征军弄来补给与兵员，远征军早已疲态尽显，无法再像之前那样对西宁城保持压力。遥遥无期的战争消磨着帝国的耐心，每周，辻政信都会收到本部敦促他撤离的电报，但皇国之魂仍促使他继续战斗，不到殒命沙场，武士总会持刀屹立，期盼着事态有所转机。\n\n游击队的活动极大的限制了远征军在乡野的活动，兵力不足，补给短缺，辻政信只能命令士兵固守几个大的聚居点。这使得他们对红军的攻势几乎没有防备，几乎在数天之内，红军就拔除了挡在面前的数个据点，完全将兰州包围。\n\n直到此刻，辻政信仍做着他的春秋大梦——只要兰州的坚墙挫败了红军的锐气，远征军就能趁机反攻，一举粉碎西北的抵抗，他就能衣锦还乡，继续当帝国的英雄……\n\n于是惨烈的攻城战开始了，担心破坏兰州城的古迹，更害怕伤及无辜，红军并未调集重炮攻城，只是在山炮与重机枪的支援下，分批次地对城头发起了冲锋。在付出了一些伤亡后，红军拔掉了城外的日军阵地，迫使他们入城固守。等待着红军的，是更加残酷的战斗——坚固的街垒遍布昔日四通八达的街巷，高一些的民居中都精心布设着火力点，最为关键的是，日军根本不在乎民众的死活，城中的居民完全没有得到疏散，而是在刺刀的逼迫下，献出最后一口存粮，流干最后一滴汗，再被当作肉盾，迫使红军付出大量的牺牲，一栋接一栋地进行扫荡……\n\n城中激战持续了数周，待到尘埃落定之时，兰州城早已伤痕累累。好似战争造成的破坏还不够，在撤退前，日军的后卫在城中大肆纵火，火势一度蔓延至数个城区…….\n\n将日本逐出兰州的战役中，中国军民付出了难以计数的伤亡……"
LFB_GAW_GUI.102.a: "但无论如何，兰州已经解放了。"

LFB_GAW_GUI.103.t: "寻根"
LFB_GAW_GUI.103.d: "在先头部队开进陕北的一天后，白俊杰所在的部队也跟着进入了陕北。他本是想打报告进先头部队打头阵的，可指导员知道之后不仅没同意，还专门命令他的班长看着他，免得白俊杰做出保尔式的行为。\n\n这让他很不服气，他明明体格健壮，训练科目成绩放眼全营也是傲视群雄，可为什么——其实他也知道理由，他是他们白家的独子，得留他传香火，更何况，他身上还有着他娘交他的使命。\n\n白俊杰家以前在陕北也算得上殷实，可日本鬼子打进来后便不可收拾地败落下去，乃至到了不能活命的程度，那怎么办呢？只有逃。白俊杰的爹便带着老婆和她肚里的孩子逃离了陕北，走时除了家里的族谱，什么也没顾得上带。白俊杰便在颠沛流离的路上出生了，好在不久后便在新疆落了。白俊杰的爹劳累过度早早归了天。留他娘俩相依为命，红军来后，他们的日子宽裕许多，但他娘早被过多的操劳搞垮了身子，不久后也去世了。\n\n白俊杰揣揣自己的行囊，在哩！他娘去世的时候，只把族谱按到他手里，然后不住地叨着寻根二字就咽了气。这便是娘的遗愿了，白俊杰想着。他出生在逃难路上，在新疆长大，对于陕北没有多少印象，只是听着爹娘晚上落泪中流出的哀诉，沉默不语罢了，可这是娘的最后愿望，恐怕也是爹临死的执念，他必须回一趟自己未曾谋面的家乡。\n\n进了陕北后，他向指导员请了假，指导员这次便大方起来，不仅同意了，还掏出几枚银元交给他，连里还给他发了套新军服，好让他“衣锦还乡”。\n\n 寻根的路不是容易的，他又没在陕北待过，怎么寻根？凭着手里的族谱还有娘临死前的交代，靠着老乡指路，他最后好不容易寻到了白家的祖屋。白家留在陕北的人也不好过，除去白俊杰一房，留下的三房里有两房也断了香火，仅剩的一房也仅有一个老妇和孙子们了。老妇上下打量着白俊杰，从他手上接过族谱，搂在怀里呜呜哭了起来，被孙子们扶起来后便踉跄着进了灶房。端出一碗擀面皮出来，白俊杰是从没见过这种吃食的，但当他坐下捞起一条面皮，吃进嘴里后，一种无以言说的感觉从他的嘴里爆开来，与他的味蕾紧紧相拥。他骨子里白家的血脉，对陕北的记忆霎时苏醒，他跪在地上，嚎啕大哭。"
LFB_GAW_GUI.103.a: "他素未谋面的故乡哟……"

LFB_GAW_GUI.104.t: "我的名字"
LFB_GAW_GUI.104.d: "£gezifu £gezifu 大同煤矿一号坑的一名矿工从不会想到，还能再从别人和自己的嘴中听到自己的名字。\n\n£gezifu £gezifu 正如编号，他是1962年1月1日来到这里的第5位矿工。也是从那一天开始，他的名字就变成了一串数字。\n\n£gezifu £gezifu 他不知道这里是哪里，他只知道这里是一座煤矿。他的家在哪里呢？他也不知道具体方位。进县城买机织布的时候，被日本人看到是个壮小伙，就给他抓进了宪兵队，再被套上头套一通拳打脚踢送到了这里。他问过工友们，大家都是这么被强制抓进来的。\n\n£gezifu £gezifu 进来的第一天，他立刻就想逃跑，可看到四周的铁丝网、门口巡逻的日本鬼子、集合时四面对着他们的黑洞洞的枪口，他还是打消了这个想法。在这里的五年，对他而言是比种庄稼辛苦得多的五年。天刚蒙蒙亮，就被宿舍外的大喇叭喊起来，随后，日本兵粗暴地踢开漏风的宿舍门，甩动手里的鞭子。将身边的工友们一个一个挥醒。穿上灰不溜秋的工作服，吃早饭。平心而论，这里吃的比家里好一点，至少有干饭。但也只是维持在一个饿不死人的水平罢了。随后就会被赶去矿坑，在队长的带领下开始一天的工作。\n\n£gezifu £gezifu 好几里且每日延伸的矿道、几百米的竖井、沿路加固的木梁与手推矿车，这些都是他每日司空见惯的事情，正如他那从来没有干净过的衣服一样。他没有文化，所以干不了像是埋雷管爆破之类的技术活，他每天需要做的就是和另外几十个工友一起，把满载的矿车推上去。\n\n£gezifu £gezifu 又过了很久，组长看了看表，告诉他们收工了。回到地面后，他们早已黑不溜秋，像个被墨汁洗过一遍的人一样。这时，他总会想到小时候自己调皮不愿意上私塾，喝了一大口老师书案上的墨水，然后被戒尺抽手心的往事。在脑子放空的这个时候，也是队长带着日本人过来的时候，那个日本人每次都叽里咕噜地说一堆，由跟着他的翻译转达，无非是“你们在这里有吃有穿，还保证你们的安全，你们一定要好好工作。”有时还会把人拉出队列一顿打。此外每个月，都会宣布增加生产定额，不过工具倒鲜有革新，下矿时发给你，上来时一个一个收走。\n\n£gezifu £gezifu 待久了之后，他也会想着逃跑，就像其他很多人一样。不过逃出去的绝大多数人都在第二天早上的例会时“回来”：尸体被绳子绑着，拖在地上，日本兵攥着绳子，骑着高头大马，在门口的空地上骑着马，尸体被拖行。嘴里叫骂着不许离开这里，不然这就是下场。再把尸体脖子套上绳子吊起来，直到脖子断了为止。\n\n£gezifu £gezifu 在这样的环境里，一串数字替代了他的名字，他丧失了自己的名字。他想过或许有一天他会像前人一样，埋在矿里。\n\n£gezifu £gezifu 这天，外面先是一声爆炸，接着便是枪声四起。组长和他们都被惊醒，谁也不敢往外看。躲在宿舍里大气不敢出，一整个宿舍都笼罩在不安的气氛中。等到后半夜枪声稀疏了，突然有人敲门，“有人吗？”组长忙把门打开，是两位荷枪实弹的士兵，他们的军服，没有人见过。“工人兄弟们！”站在前面的那个士兵向房间里喊话，“我们是共产党领导的红军，我们已经把这里的鬼子赶跑了！现在我们需要对这座煤矿进行登记，请各位工友们，依次过来登记！”\n\n£gezifu £gezifu 等轮到他的时候，一瞬间，他似乎忘记了自己的名字，那个他、这个数字，似乎没有关联，两个平行的人生。午夜睡不着想家时，嘴里轻轻吐出aa三个音节。下一个瞬间，他望着面前比他高上一头的正在写字的士兵，哆哆嗦嗦地："
LFB_GAW_GUI.104.a: "“我叫……呃……我叫，我叫孙兴民！”"

LFB_GAW_GUI.105.t: "洛阳解放"
LFB_GAW_GUI.105.d: "£gezifu £gezifu 洛阳，古称神都、洛邑、洛京。在前不久结束的战役中，战士们凭借着掩体和废墟逐渐渗透进洛阳市的中心，终于，在一声枪响后，洛阳解放战役基本宣告结束，剩余的俘虏被转送至后方处理。\n\n£gezifu £gezifu 王贵安失神地望着眼前的一片废墟，他是个土生土长的洛阳人，在他小时候，这里还是一片广袤无际的山区丘陵，他有时候顽皮，跑到山顶去和小伙伴们玩捉迷藏，偶尔又会去一些似乎是很久很久以前的人们所建起来的破房子那去寻找宝藏。但他总是会被妈妈发现，在被痛打一顿后，妈妈像是唱摇篮曲一般跟王贵安讲起这个古城的故事和生活在这里的人们的故事。但自从日本鬼子占领了大半个中国后，王贵安和父母在逃难的过程中走失了，他已经整整十年没有见过他的父母了。\n\n£gezifu £gezifu 小时候王贵安听大人说，时间是个了不得的东西，久了就什么事情都忘了。但亲生父母的面容，声音，往事，如同刀刻一般在他的脑海中久久不散，一天比一天清晰，也一天比一天痛苦。他忘不掉也不敢忘，这份仇恨太过强烈，即使重返故乡的土地，也不能使他释怀，小时候在废墟里痛哭时听到的飞机轰鸣声、喊叫声，现在仍然在耳边响起，只是这次，他不再是孩子了。\n\n£gezifu £gezifu 他的眼睛又重新恢复神采，端起枪继续向前出发。\n\n——————————————————\n\n£gezifu £gezifu “据粗略统计，洛阳市除周边村庄外，其余基础设施，工业设备均受到不同程度的人为毁坏，九成以上的日军已被歼灭，一成日军携带着一部分重要资料逃往满洲。洛阳重要文物如龙门石窟，白马寺等具有重要历史意义的文物均受到不同程度的损失，大量佛像被损毁，大量文物古籍被盗走，侵略者如果带不走的就砸烂，放火，如同一百多年前的英法联军对圆明园所犯下的恶行那样。自然环境被严重破坏，对洛阳的修复工作迫在眉睫，这座在中国历史上具有重要意义的城市，见证了如隋唐等朝代兴盛衰亡的古都，如今竟近乎毁于侵略者之手，笔者恨不能提枪上阵，剿灭敌人……以前我们只能眼睁睁地看着侵略者玷污我们的土地，侵犯我们的人民，亵渎我们的文化，但是现在，红军来了，红军来了！他们对着整个黑暗世界宣告着对日本军国主义侵略者的最强烈反攻已经开始，这是中国人民的伟大时刻，也是中华民族的伟大时刻！”"
LFB_GAW_GUI.105.a: "编者注：［本文章刊登于洛阳解放当日的洛阳晚报，未经删改，编辑室内闻者无不落泪。］"

LFB_GAW_GUI.106.t: "进京"
LFB_GAW_GUI.106.d: "£gezifu £gezifu 此刻，北平城中，政府大院内一片混乱，不断有人抱着一摞摞文件向空地上冒火的铁皮桶里倒，从一楼到六楼，时时有人在翻箱倒柜地搜集角落里的纸片，刻刻有人将手中的文件抛洒出去。\n\n£gezifu £gezifu 视线离开这里，前往外城，德胜门、安定门内外的民房正在熊熊燃烧。警察失去了往日的威严，没有日本人撑腰，他们这些外地调来的只能关紧警局大门，任由外面的秩序不断恶化。北平城此前从未被共军占领，所以市民们正在研究门口挂什么好。大清的龙旗显然不行，民国的青天白日呢？这帮人信马克思，可能也不行。思来想去，扯了一块红布，一块白布，到时候两面一起挂！\n\n£gezifu £gezifu 翌日，经过一天一夜的战斗，城外的枪炮声渐稀，偶有枪声响起。城门被炸开了，城墙内外联系断绝，不知道城外的百姓如何，不过这不是内城的老北京们最关心的，家家户户房门紧闭，北城侥幸存活的居民，躲在藏兵洞中。大家都在等待着自己的命运。\n\n£gezifu £gezifu 不知是谁大喊了一声“过兵了！”只见一队队穿着朴素的士兵沉默地从西直门进入北京城内。家家户户依旧家门紧闭，一双双眼睛从夹缝中偷偷地盯着这群士兵。想象中热闹的进城仪式并没有发生。"
LFB_GAW_GUI.106.a: "我们还有很多事情要做！"

LFB_GAW_GUI.107.t: "惨象"
LFB_GAW_GUI.107.d: "£gezifu £gezifu 根据陕西红军保存下的中央资料，山东，一直都是各大抗日根据地里最活跃的一个。那里的人民全力生产，那里的游击队奇兵频出，那里的根据地军民和谐，那里的抗日情绪永远高涨……\n\n£gezifu £gezifu 可当红军时隔20年又来到济南边的一个村庄时，他们却没有看见半点生机。\n\n£gezifu £gezifu 红军并没有看见一个他们设想的饱受战争摧残仍挣扎求生的村子，而是一个流淌着血与泪的死村。\n\n£gezifu £gezifu 村子里到处都是燃烧的房屋，村子外老远就能闻见味，战士们皱着眉头捂着鼻，一步步向村庄靠近，可是为什么在呛鼻的烟中，还有一股烤肉的奇怪味道？继续往那走吧，不过可得小心，可能还有没来得及撤离的日军埋伏着他们，派排里最机灵的小张去侦察，他会好好看的。小张先行朝着村庄去了，但过了一会，却传来他凄厉的叫喊。\n\n£gezifu £gezifu 怎么回事，小张遭了埋伏？战士们的心骤然缩紧，快步赶上去。小张的叫喊还在继续，呜咽在空中久久不能散去。战士赶到了村口，一个被戕害的村民躺在那里，双眼满是恐惧。战士们的枪都有点握不紧了，他们大概明白小张凄厉的叫喊是为什么了。村子里四处都是村民的尸体，他们有的胸上有一团血花，有的被捆在门柱上，有的被割去了双耳，有的嘴中插着一把刺刀。每个战士都咬紧了牙齿，每个人都死死攥住他们的枪。\n\n£gezifu £gezifu 在村子的中心，他们找到了小张，他跪在地上，以头抢地不停呜咽着。他的身旁躺着一个妇女的尸体，一丝不挂。她的腹被剖开来，双腿张着，双手掌心各有一把刺刀，她的双目圆睁着，了无生气的眼珠中似乎蕴藏着无止境的憎恨，排长踉跄着走过去，试图为她阖上双眼，却怎么也抹不闭她的眼，身经百战的排长怔怔地看着这双仇恨的眼睛，呜呜地哭了。\n\n£gezifu £gezifu 两个小时后，全排在村子中心沉默地集合，面对着二百余具村民的尸体，每个人都一言不发，但泪水早已掩面。排长攥着一面日本的军旗，狠狠掼在地上。"
LFB_GAW_GUI.107.a: "我们会让那群畜生血债血偿！"

#停战事件
LFB_GAW_GUI.1.t: "日本提议和平"
LFB_GAW_GUI.1.d: "抗日民族统一战线持久不懈的斗争终于取得了成果！\n\n日本派出了一支由其外相带领的外交团队，来到南京，向统一战线方提交了和谈请求。这是战争趋于白热化之后，第一次主动由日方提起的谈判要求，很快得到了统一战线的同意。在南京郊外的一处隐蔽之处，国共代表与日方外交团一起举行了一次秘密会谈。\n\n尽管整个世界都知晓日本在战争中处于劣势，但他们仍摆出了“东亚之主”的高傲姿态。他们愿意承认中国的独立地位，并同意以山海关划定两国边界——但这一切的前提是，统一战线必须即刻撤出满洲，且承认满洲国的存在。\n\n是的，这就是日本人的“让步”，尽管中方有相当一部分代表认为这完全不可理喻，无法接受，但日方代表却隐隐暗示着我们不接受的后果：由于满洲撤侨已告完成，日军可以“使用一切手段促使中方接受和平条件”。同时，各方面传来的情报也明示着日本已经召回了其在亚洲的所有可支配的军事力量，决定破釜沉舟，与统一战线鱼死网破。愈加严峻的海岸封锁，昭示着即将到来的全面登陆，而我们有理由相信，日本不会吝惜其手中的最后底牌——核武器。\n\n日本要求的条件在许多人看来都难以接受，这不仅是对中国主权的继续践踏，也是对牺牲在抗日战场上的将士们的亵渎。较为理智的代表们据理力争，争得了日方的些许让步——他们同意西满洲区域独立以作为中日间的缓冲地带。\n\n谈判进行了半日，除去愤而离席的护国军高层，其余大部分代表已经对和谈表示赞同，但毫无疑问，我们的军队仍然踏在东北的土地上，所以撤军与否，和平与否，都在我们一念之间……"
LFB_GAW_GUI.1.a: "事已至此，暂且从权……"
LFB_GAW_GUI.1.a.tt: "§Y满洲地区将会分治§!,§G华北地区将会根据现状进行分配§!"
LFB_GAW_GUI.1.b: "公道得胜，十死无悔！"
LFB_GAW_GUI_1_b_tt: "§R这不是明智的选择§!"
LFB_GAW_GUI.2.t: "旭日陨落"
LFB_GAW_GUI.2.d: "[JAP.GetLeader]已经数日没睡个好觉了。\n\n军部传来的净是些坏消息。无论陆军海军，在战前哪个不是趾高气昂，从不把地球上的任何一支军队放在眼里？如今却被曾经瞧不起的中国人搞得焦头烂额——尽管战报从来都是“我军胜利进击”，“即刻剿灭匪首”，但只要有心之人随便翻翻往日的期刊，会发现红军已经完全溃灭了四次，护国军已经损失了上千万……面对国内淤积的不满，他只能与军方一起不断罗织着谎言，却无法掩盖战线不可避免的溃散。直到某一天，军部递来了一封简短的信。\n\n是满洲来的消息，内容很简短——满洲的沦陷已成定局，侨民疏散计划已经失败，在中国的军队也陷入包围。帝国现在只剩两个选项，是启用核武，在满洲对敌人予以重创；抑或是和谈，屈辱地放弃百年来苦心经营的东亚霸权。\n\n [JAP.GetLeader]不禁怒极反笑，当初信誓旦旦地承诺问题不大的是军方，前线的消息从未准确过，是政府一直顶住压力，承受人民的唾骂。事到如今，他们反倒要把责任全甩到政府——还有他本人身上。他们给予的两个选项，一个是要政府成为屠杀亿万人的刽子手，让日本在外交场上自绝于世界，乃至使得整个世界陷入火海；另一个则是要让他自绝于日本人民，被写进教科书，世世代代钉在耻辱柱上……\n\n 他走进东御苑地下，藏着帝国最高机密之处，看着在玻璃柜内，一个朴素的红色按钮。驻足良久，他终是没有动作，转身离开。\n\n统一战线的两大政权，都扎根于西南或西北内陆的崇山峻岭之中，打击大城市对中国的影响微乎其微，若想扭转战局，帝国需倾尽其核武库，以期喝退疯狂的中国人。但将大陆化为废土后，帝国在实际上也将失去那里的资源与人力，更不要提冷战的另外两极正时刻虎视眈眈……帝国将赢得这场战争，但将失去未来。\n\n再三思量过后，他还是带着内阁草拟好的诏书，往皇居走去……"
LFB_GAW_GUI.2.a: "“朕深鉴于世界大势及帝国之现状，欲采取非常之措施，收拾时局，兹告尔等臣民……”"
LFB_GAW_GUI.2.a.tt: "§G日本投降了,我们胜利了！§!"
LFB_GAW_GUI.21.t: "深入敌后"
LFB_GAW_GUI.21.d: "“长官，我这药给孩子送去的，您行行好哈，我孩子很急着用的，真的…”北京城自沦陷时开始，就设置了非常严密的安保检查措施，无论是带了什么东西，都得检查一遍才能过，小到铅笔盒，大到卡车，只要不是日本人的，那都得照例进行检查。\n\n“不是我为难你，哥们，但是你这药我必须查，你良民证拿出来倒是能缩短一下流程，当然还得稍微这么忍痛割爱一下不是。”治安员凑过来和高庆小声说道。\n\n“欸好嘞好嘞，不过我要和您谈谈，我良民证在这呢，咱们去那旁边聊聊？”高庆和治安员走到警卫室旁边，高庆左探右望，确认没人后这才开了口。\n\n“哥们，活的咋样啊，滋不滋润？”\n\n“治安员一听这话，就知道高庆不是什么一般人，打量了一番高庆后说“说吧，你是共的还是南边的。”\n\n高庆本来想着只是能进城，但是在一步步试探之下认为这人很可能是北联的，“不如赌一手”高庆嘀咕了一下，和治安员说“北平联合俱乐部，不知道兄弟有没有听说过？”\n\n“俱乐部啊，你现在进去把你孩子安顿好，我们晚上在中日友好医院门口见吧，我带你去玩玩。”说罢治安员就把高庆带进城门，“那晚上见”。\n\n高庆穿梭在大街小巷之中，遍地都是流浪汉，还有日本兵横行霸道，这些人的日子就更不好过了，那日本兵念着蹩脚的所谓协和语，使唤着人，高庆已经对这种场面司空见惯了，只是低着头往前走。这些流浪汉里有汉人也有日本人，他们当初漂洋过海来投机，却落得这么个下场。但高庆顾不得这些，快步回到他在北平的家，休息去了。\n\n到了晚上，高庆去医院门口等到了治安员，治安员带着他走进了一个台球厅，把一个小皮革本交给高庆，说道：“这位同志你好，我是北平共产主义小组的洪元良。”"
LFB_GAW_GUI.21.a: "“你好，我是中国共产党北平特派员高庆。”"
LFB_GAW_GUI.22.t: "从田间来，到田间去"
LFB_GAW_GUI.22.d: "一开始，没有人在意这个小村庄的村民在干什么。对于改组政府的官员还有当地的乡绅来说，只要他们把每次的地租交够，把主子派的差役做完，为什么又要多花精力去得知他们在干什么，想干什么呢？直到这个村子里发展出的运动渐渐危及到这片土地上的每个达官贵人时，他们方才意识到他们曾经干了什么傻事。\n\n在现实的重压下，在战争的阴云下，一队又一队的农民举起了他们的旗帜，霎时间四处都飘扬着他们的旗帜，四处都回响着他们的口号。\n\n“王侯将相，宁有种乎？！”\n\n“分田地，均贫富！”\n\n“反日复明，再造天朝！"\n\n”打倒帝国主义，分粮分牛分地！“\n\n”苍天已死，黄天当立！“\n\n总之，坐在张英才面前的这群反抗组织代表，大致就是提出或者喊出这些口号的人。他看着面前这群穿着简朴，却互相争吵，气势汹汹的农民们，不禁揉了揉额头。这些争吵的人，大多都是苦命人，因受不了日渐加重的压迫才揭竿而起。他们发起运动的背景，运动的手段、意识形态也不尽相同，可能让他们愿意同时坐在他这个共产党干部面前的，也只有共同的敌人：改组政府还有他们的日本主子。\n\n张英才清了清喉咙，刚想说两句——”喂，‘苏维埃’先生，我听说你们的地盘是不是搞共产共妻？“却被这样的疑问，或者说诘问给噎了回去，他身边的两个小战士正想挺身激辩，却被他用眼神制止了——先说正事。抵抗组织虽不少，但许多却是缺枪少弹，没有长远发展的可能，而今天他能够邀请这些代表来他这里，也是要商讨援助的事宜，这也是他们愿意应邀的真正原因。"
LFB_GAW_GUI.22.a: "“我们将会一视同仁地援助各位”"
LFB_GAW_GUI_22_a_tt: "通过无差别地支援民间武装，我们将能够一次性地§G大幅降低§!日军在华北的的§Y筑垒等级§!————但是这也会导致§R混乱度增速§!提升。"
LFB_GAW_GUI.22.b: "“我们会先与各位进行一下谈话”"
LFB_GAW_GUI_22_b_tt: "我们将会对这些民间武装进行思想教育和组织，这些敌后有生力量将会§G降低§!日军在华北的§Y筑垒速度§!。"
LFB_GAW_GUI.23.t: "沉沦"
LFB_GAW_GUI.23.d: "又是一年华北的严冬，透过薄薄的窗纸，寒风吹进阁楼，惊醒梦中游子。\n\n在梦醒的醍醐味中，他忆起了老家无为，时值新春，大街小巷是否挂满了鱼灯？离家多年，他曾无数次在梦中回到了那座安徽古镇，但他却不能回去，现实与自傲禁锢着他。他对故乡的记忆，还停留在自己收到北大哲学系的录取通知书之时。那是他一生中最辉煌的时刻，父亲摆开大宴，半个镇子的人全来庆贺，老先生赠予长诗祝他前程似锦，婆姨们也交头接耳“准是那文曲星下凡了…”。\n\n而北京——这座古城却没有对他张开欢迎的臂膀。寒冷的天气，艰深的课业，当地人根深蒂固的排外，都令他水土不服。但他仍坚持了下来，毫不懈怠。他时常待在图书馆中，与先哲为伴；哲学的学习免不了激辩，他便每每自告奋勇，操着浓厚的乡音打赢了一场接一场的论战。第一年，他奋力攻读德国古典哲学，希冀从其中寻到救国良方，但从康德到谢林，从黑格尔到费尔巴哈，每前进一步，都是新一套层层嵌套，愈加困难的体系，思维不仅没有明晰，反倒愈发头昏脑胀；于是在第二年，他折回古希腊，期望能从柏拉图与苏格拉底的著作中窥见现代文明的根基……世事变迁，他仍翻着古书，沉沦于先哲的智慧，却对周遭的现实充耳不闻。\n\n但现实终是找上了他，并结结实实地，将他拖入了深不见底的泥潭——一封检举信，实名举报他持有“破坏大东亚共荣”的危险思想，令他失去了继续深造的资格；一封家书，则言明了因天气大旱，故乡发生饥荒，虽不需要他进行接济，却不得不停止生活费的供应。象牙塔顶的雏鹰被抛入生活的深渊，折断了未丰的羽翼，就此沉沦……\n\n起初，他曾试着给报纸的时评专栏投稿数次，却无一通过。无奈之下，只好一边在一家不入流的书店当会计，一边投稿到淫秽杂志，聊以为生。先哲的智慧沁润了他的头脑，却对他的现状无计可施。他省吃俭用，把一块钱掰成两块花，却远远追不上因经济衰退飞涨的物价……北风朔朔，寒意彻骨，他只得紧裹漏着絮的棉衣，瞥向窗外，北平城繁华的市街如今人迹罕至，巡行的士兵监控着每一条街巷……\n\n起身，收拾好背囊与通关的文书，他今天就要离开这座正在窒息的城市，去到河北的乡间，调查不断向北蔓延的饥荒。轻推房门，他没有丝毫犹豫地离开了发霉的书斋，隐隐之间，他似乎有一种预感——或许，在书斋之外，自己能寻到人生苦寻的价值，又或许，某个持激进立场的报纸，会接收自己沿途所见，作为一篇“特别报道”。"
LFB_GAW_GUI.23.a: "铁幕难买自由贵，青春誓给人民累。"
LFB_GAW_GUI.24.t: "立众"
LFB_GAW_GUI.24.d: "用一整天的时间，他通过了审查与盘问。离开北京，越是向南走，饥荒的影响似乎就越重。在严苛的配给制下，城内的人只是面有菜色，至于城外的村庄，则无不掩埋于深雪之下，傍晚时不见炊烟，直到晚上也只有几点与萤火无异的亮光。幸得月光明朗，青年才得以继续前行。他在朋友家中落脚，以数枚银元换口吃食，行了快半个月，就这样在京城周围走了一遭。\n\n在肥力衰退的土地上，农民仍费力耕耘，无奈天公不作美，今年的收成仍旧不好。持续到入冬的大旱不仅令秋收光景惨淡，更夺走了将近一半的越冬麦。往年的瑞雪预兆着来年的丰收，但如今压在厚雪之下的，只有干瘪的尸首。能拯救华北免于来年饥荒的，除了奇迹，就只有政府的救济了。但青年知道，还是前者的可能性要更大些——\n\n聊胜于无的储备粮早在60年代初的自然灾害时就被吃光了，随着农民绝望地吃光了种粮，自给自足的小农经济便迎来了总崩溃。地主趁机兼并土地，哄抬物价，农民只得逃荒，或沦为佃农。他曾与同学就此大声激辩，也曾与市民们坐地绝食，鼓动政府发放救济，抑制粮价……他自觉做了一切力所能及的事，却无法撼动这悲惨的现实分毫。或许真如黑格尔所说，唯有绝对精神的运动才能促成变革，而中国，这个民族的精神早已在腐尸中衰朽，禁锢于历史与帝国主义打造的层层监牢之中，所以他只能将报纸上的一幕幕惨剧看在眼里，看人们扒树皮，刨树根，看绝望的人抛妻弃子……\n\n自那之后，灾难从未结束，无论年景好坏，饥荒的阴影始终笼罩在华北平原之上。\n\n他本以为目睹了一幕幕惨剧后，自己会感到震惊，哀伤，愤怒……但在盖着皑皑白雪的林间，他遇到了一群衣衫褴褛的人。他们自称是数年前的农民起义军，尽管华北已戒严多时，尽管他们缺吃少喝，头顶没有片瓦遮头，但他们仍邀请青年来到林间的营地，大家围坐在篝火旁，喝着稀米汤，唱着质朴的歌谣：“政府说得都好听，口口声声为人民。我农民实在难忍，哎哟，哎哟，我农民实在难忍；四两米稀饭照见鬼，田里草长得比人深，一亩七斤、八斤，哎哟，哎哟，一亩七斤、八斤……”\n\n报纸上将他们描述成无耻的匪帮，背叛大东亚共荣的“国贼”。但在青年看来。他们似乎并没有那么不堪。他们的首领是一位矮小黝黑的中年人，队伍刚吃完饭，他就把青年拽到跟前。他没读过书，却能侃侃而谈。他谈到老乡们因何揭竿而起，暴动又如何化为起义…他谈到血腥的镇压，谈到他们是如何与沦为土匪的同僚们分道扬镳的，在华北戒严的当下，曾经的同僚因遭到群众唾弃而遭到绞杀，而他们这支队伍却吸收了一次次抗税运动的新血，因而生生不息…伴着摇曳的火光，他们谈到深夜，在最后，首领从怀中掏本印刷劣质的红皮薄书，递到青年手中——\n\n“你是读书人，算弟兄们求求你，能不能给俺讲讲这书讲了些啥？”\n\n书的名字是《论持久战》，作者他并不认识。但相比于青年常看的著作，这本书写得很白，连对军事一窍不通的青年，也能看个大概。青年边翻书，边给首领转述着上面的内容。而结合自己的经验，首领总能在简单的文本背后读出普适性的军事理论，仿佛他才是学识更渊博的那个……\n\n冬日的黎明总是来得很迟，但它终究来了。透过林间细缝，望着远处缓缓升起的清冷的太阳，青年不禁决定——"
LFB_GAW_GUI.24.a: "要留在他们的队伍中，与他们同行"
LFB_GAW_GUI_24_a_tt: "民间的进步力量开始加入我们的队伍，为我们提供§G小幅的增益§!！"
LFB_GAW_GUI.24.b: "要回到城中，用他们的事迹传播希望"
LFB_GAW_GUI_24_b_tt: "民间的进步力量将会自发组织起来，为我们提供§G增益§!，但是§R混乱度增速§!也会小幅提升！"
LFB_GAW_GUI.31.t: "进入东北"
LFB_GAW_GUI.31.d: "长官：\n\n第一批跨过山海关的指战员们发回了最新消息，他们已经正面遭遇了日军的防线。日军似乎并未料想到华北防线会被突破，在东北的设防并不稳固，但鬼子兵们一个个张牙舞爪，抵抗总体来说要比在华北时激烈许多。据侦察兵汇报，伪满洲国的部队已经完成全面动员，日军正在整个东北的乡村坚壁清野，大量日侨正匆忙地撤往朝鲜——我军已踏上日本帝国的心脏，敌人必将动用包括核武器在内的一切手段，全力以赴地试图挽回局面。"
LFB_GAW_GUI.31.a: "快速进军，我们必须粉碎他们的痴心妄想！"
LFB_GAW_GUI_31_tt: "为了达成§V彻底的民族解放§!，我们需要在§Y有限的时间§!内攻占东北。\n\n如果日本在满洲的筑垒达到§R3级§!，我们便会失去一举解放全中国的机会！"
LFB_GAW_GUI.41.t: "且看那大海"
LFB_GAW_GUI.41.d: "凌晨的港口蒙着一层轻薄的雾霭。平静的海面上漂浮着三艘航船。官兵们神情肃穆地站在岸上，没有礼炮，也没有欢呼，中国人民海军就在这一片灰色中正式成立了\n\n刘昌毅站在一处荒弃船台地高出，身边是几位身经百战的地下党员，还有远东苏维埃派来的海军顾问，他们身上的白色海军军服是临时赶制的，却在海色的映衬下闪着耀眼的白。\n\n“同志们，我们赢得了胜利。我们欢庆党的成功，民族的解放，国家的独立。我们从祖国的江山上赶跑了日本人，彻底地洗刷了百年来的耻辱。但是在这胜利之中，我们更需要惊醒：我们的国家落后，所以才饱受欺辱；我们的军队落后，为了打败日本人，我们要用肉身去博人家的飞机和坦克；而我们的海军呢？我们没有海军，所以祖国的海疆洞开，敌人能封锁我们，困死我们，从我们意想不到的地方发起进攻。而我们只能缩进内陆，躲进山里，和敌人在自己的国土上绞杀，这就是一片狼藉，生灵涂炭啊……”\n\n说到此处，他顿了一顿，将自己的衬衣解开，露出一道道触目惊心的伤疤：哪怕是再坚毅的战士，也不禁倒吸一口冷气。\n\n“这么多道疤，得有一半都是在天津被那鬼子的军舰给炸的。他们的船看着吓人，有的插满了炮管，像刺猬一样，更有的像座小岛，能在上面开飞机。就凭这些东西，他们把半个天津炸成了废墟。当时我就在想，咱们这哪是在进攻啊，鬼子直接把要塞和机场开到了家门口……”\n\n“放心吧首长，改天咱们就能把战舰开到东京去！”不知哪位年轻的战士在下面打趣。\n\n“看把你能的！”刘昌毅指向身后的三艘舰船：“就凭这几艘老船，不行。他们顶多算小炮楼，跟鬼子建村子里那种似的，可没法跟人家硬碰硬，只能护着海疆。但也不是说就没法打，咱们不老是讲这个‘农村包围城市’，鬼子要是再来，咱们就给他们点颜色看看，啥叫‘小炮楼围大要塞’……”"
LFB_GAW_GUI.41.a: "百年海军，道阻且长"
LFB_GAW_GUI_41_tt: "获得一支由伪政权缴获舰艇组成的小型舰队\n\n§G终有一日，我们将会戎卫祖国的每一片海疆！§!"
LFB_GAW_GUI.42.t: "故土"
LFB_GAW_GUI.42.d: "汉城郊外曾经有一家小餐馆，老板的手艺很好，价格也便宜，饱受邻里街坊的欢迎。\n\n“那家店啊，我小时候经常去吃。”遥指着街边荒芜破落的餐馆，青年说道：“但是，老板不知道从什么时候起就消失了。” \n\n“是吗，还真可惜。”发问的老人得到了令他满意的回答，转身向那家餐馆走去。\n\n他站在门口，用手抚摸着破旧的门锁，然后从口袋里拿出了许久未用过的钥匙。门锁虽然生锈，但是依然忠实地履行着职责。在赶走了占据房屋的老鼠之后，老人把门锁好，把窗户闭起来，拿出了第二把钥匙，用来开地下室的钥匙。\n\n二十年前，这个明面上的餐馆曾是朝鲜共产党情报网的一部分，当时日本联合舰队在太平洋战争上逐渐陷于被动，无数意识形态迥异的组织为了夺取新生国家的领导权，在全国各地设立了大大小小的情报站，此处便曾是其中之一。\n\n当年的老人无比坚信，韩国获得自由的日子很快将到来。\n\n然后夏威夷就湮灭在了核子火焰当中。一开始，没人愿意相信日本人就能凭此获得胜利，但是旧金山协议的签署掐灭了最后一丝希望。往后的岁月，复国无望。\n\n撤退的那天非常狼狈，他只销毁了重要的文件和电台，甚至没有时间销毁挂在墙上的独立标语。这么多年了，他从来没回来过。\n\n现在看来，他可能是多虑了，因为那个标语还好端端地挂在那里\n\n饥饿者寻食，渴饮者求水，我韩人争自由。\n\n这句话写下已经有五十年了，韩国依然在日本的统治之下。\n\n而现在，日军撤回了鸭绿江以南。在战败的阴云笼罩之下，言论管制必以往更甚，汉城内外一片死寂。但这并非希望的终结——日占朝鲜表面的静默之下，实则暗流涌动。日本的“东亚新秩序”已经彻底地被撼动了，而北部边境上的异动更是只增不减。在自己新盟友的支持下，一度式微的抵抗死灰复燃，而这次，他们不会退缩。"
LFB_GAW_GUI.42.a: "漆黑中，有人点亮了小餐馆的灯。"
LFB_GAW_GUI_42_tt: "§G属于他们的斗争才刚刚开始！§!"

#其他
 wandering_Long_Way_Home:"归途路漫漫"
 wandering_Long_Way_Home_desc:"§R可怜故乡河边骨，犹是游子梦中人§!。毫无疑问的是，近卫步兵第八十八旅的战士们是坚定的共产主义者，他们能为了共产主义的理想在俄罗斯大地上为工农的解放而斗争，为持起共产主义的火炬而抗争。他们的滚烫的热血留在了苦寒的而西伯利亚之地。但他们的思乡之情却从未消失。一支孤军，踏上万里归乡之路————这毫无疑问是一次必死的旅途，但他们还是出发了。\n\n中国的土地之上，旭日高照之下，众生凄惨。不要回来了！这里已经不是家了！隐约间，有人在这些游子们耳边高喊。\n\n是的，游子们熟知的故乡早已不在，在黑暗的反动统治下，他们记忆里魂牵梦萦的那个故乡，早以消失不见，他们记忆里那些旧人至亲，早已化作路边无尽枯骨中的一员，化作了共荣圈富豪的肥料。\n\n但游子们是坚定的共产主义者，他们必须举起火炬，想办法照亮自己那已经深陷黑暗故乡。\n\n§G此后若没有炬火，我们便要化作那点点星火，去唤醒沉睡的燎原之光，驱散黑暗。§!"
