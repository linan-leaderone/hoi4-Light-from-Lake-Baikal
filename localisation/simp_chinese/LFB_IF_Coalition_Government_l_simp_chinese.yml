 LFBCG.8.t:"“百家争鸣”"
 LFBCG.8.desc:"青天白日旗与镰刀锤子旗在主席台上方形成微妙的夹角，夹角下是今天会议的轮值主席。周恩来环视会场，一屋子的代表着装各异，互相交谈着，也许是在交流今天的议案，也可能是下次的选举，或者单纯只是在交谈今天午餐的去处。到了开会时间，周恩来也只能请大家先安静，随后宣布今天的会议开始。\n\n第一项是关于南京的战后重建项目，周恩来在主席台上聆听着陈述，时不时做一些记录。但代表刚刚结束陈述走下台，台下的一名议员就大声提出了自己的疑问“南京现在的战后损害都已经修缮得差不多了，怎么还要另外拨资金去‘重建’？该把重建的精力放在其他地方了吧？西安的工厂之前在鬼子的轰炸下破坏惨重，到现在都还因为资金不足，修复工作断断续续的！”周恩来认得他，陕南地区地下党出身。此时的他从自己席上站起来，对着大会的众人大声地阐述着重建西安地区工业的重要性，与昔日身为地下工作者的时的表现大相径庭。\n\n“南京是国家首都，重建好有什么不可？！”很快，有人同样大声打断了他的发言，是一个商人出身的代表，“国家现在是急需对外放引进外资的时候，把首都重建好才能展现我们的精神风貌，这可比重建西安工厂有益得多！闷头重建内地，你上哪弄钱去！”此言一出，代表们的话匣子纷纷被打开了，也全然不顾了会场秩序，各自开始激烈的表达意见……\n\n不出意外，最后代表们也没有达成共识，议案只能搁置。散会后，周恩来回到自己的办公室，对着桌前自己拟的“完善国民议会开会流程”的议案，揉了揉眉头。"
 LFBCG.8.a:"“不知要扯皮到几时。”"
 LFBCG.918.t:"雪消时节"
 LFBCG.918.desc:"在两股伟力的激烈碰撞下，草原东部洒满了鲜血，隆冬时节，西伯利亚的信风送来厚雪，埋葬了未及时收敛的尸体，还有一切誓言，荣耀，与人世间的重要之物。而后春日降临，繁华更胜往日的草甸间缀满了繁花，若有人踏青驻足，便会理所应当的为这和平之景赞叹。但在此时此地，并无人有此闲心逸志——受尽压迫与战乱折磨的人们正想法设法地跨越边境，他们拖家带口，越过危险的无人区——虽然硝烟已经散尽，但草甸间仍潜藏着大量地雷与未爆弹。\n\n人们冒着生命危险也要离开的原因，便是因为此时西东北混乱的时局。虽然这片地区名义上是中国和满洲之间的争议领土，但仍在各方面与旧满洲国有着千丝万缕的联系。而在某些层面而言，反倒是“青出于蓝”——作为一片非军事化的地区，地方政府根本无法对各地施行有效的控制，以致六十年代一度被压制的匪患再度猖獗。故此，几近沦为无法之地的西满洲，就这样以澎湃的动力向西方输出着难民潮。\n\n元气大伤的日本帝国乐见西满洲忠实地履行着“缓冲区”的职能，并未过多地干涉此地的混乱，这反倒给了新生的中国政府可乘之机。在白山黑水之间，一支游击队正轻巧地穿行，作为旧日“匪患”的一部分，他们有着一个更响亮的名字——“东北抗联”。受条约所限，新生的共和国无法直接派兵进入争议地带。因此，在经过谨慎的政治考量后，他们决定转而支持由在东北游击多年的朝鲜族抗联将领金日成，凭借他多年的游击经验组织起一支新的武装，与各地匪帮和日帝国主义的代理人战斗。"
 LFBCG.918.a:"白雪之下，黑土之中，沉眠的种子即将发芽。"
 LFBCG.1644.t:"[Get_newspaper_header]西满洲剧变"
 LFBCG.1644.desc:"中日战争结束后，双方围绕着满洲问题在谈判中进行了多轮拉锯。最终，满洲西部的大片地区被划为了待议领土，由满洲帝室成员溥杰为首的重建委员会负责该地区行政。不过战后满洲地区混乱的局势决定了重建委员会根本无力对地方进行有效掌控，西满洲地区事实上已经成为了一片无政府地区。\n\n但正是这种局势给予了满洲地区的地下抵抗势力可乘之机，尽管早在二战结束前满洲地区的抵抗运动就已经近乎销声匿迹，但事实证明，反抗的火种从未熄灭。近日，一支名为“东北人民自治军”的武装力量夺取了重建委员会驻地承德后宣称已经掌控了整个西满洲地区，并迅速与中国方面展开接触。据悉，这支武装力量的前身即为二战时期活跃于满洲地区的东北抗日联军。\n\n东京方面对于满洲局势反应异常激烈，认为中方有意支持武装分子颠覆满洲政权，试图重启战端；而南京方面则表示目前的局面不过是民心所向，中方的行为完全出于对东北人民自由选择的尊重，绝对无意破坏来之不易的东亚和平。"
 LFBCG.1644.a:"母亲，归期到了，快领我们回来！"
 LFBCG.1644.b:"虚与委蛇，令人发指……"
 LFBCG.1644.c:"昔日的三极之一已难掩颓势。"
