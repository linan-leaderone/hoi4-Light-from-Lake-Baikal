COX_Raise_Two_Flags_desc: "在华北的平原，西北的大漠之上，灼热的旭日终是退却；而在南京的古城深处，国共两党也终于达成了妥协，一个民主的共和国在废墟上诞生。然而事情并没有这么简单。截然不同的意识形态，对经济体系的争吵.....更重要的是——两党似乎都不愿意放弃自己所辖的军队和自己曾经的领地。火药味正在南京古城内弥漫，而新中国的前程，似乎也变得扑朔迷离起来......"
