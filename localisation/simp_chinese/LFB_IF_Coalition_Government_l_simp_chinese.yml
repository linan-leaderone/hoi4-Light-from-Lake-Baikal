COX_Raise_Two_Flags: "双旗共举"
COX_Raise_Two_Flags_desc: "平原之上，残阳映照焦土，南京城内，新生的共和国正踉跄前行。战火熄灭，硝烟散去，国共双方在废墟之上握手言和，一个崭新的国家宣告诞生。然而，分歧从未消弭，权力的较量仍在继续。\n\n意识形态南辕北辙，经济政策水火难容，最尖锐的问题仍旧横亘在谈判桌上——军权如何划分？各自为政的武装部队依旧在原属领土上驻扎，彼此对峙，拒绝交出指挥权。南京议会厅内，辩论无休无止，谈判桌外，火药味愈发浓烈。军队对峙，行政权分裂，政府运作举步维艰，整个国家在动荡边缘徘徊。\n\n统一，是唯一的出路。但现有的政局，注定不会有轻松的抉择。整合军队，重塑权力架构，建立统一的国家体系，每一步都充满阻力，每一个决定都可能引发新的裂痕。双头旗飘扬之下，国家的未来仍笼罩在迷雾之中，前方的道路，充满未知与风险。"
COX_Broken_Blade_Sinking_Into_The_Sea: "断刃沉海"
COX_Broken_Blade_Sinking_Into_The_Sea_desc: "战火的硝烟虽然已经散去，但它留下的创伤却深深地刻在了这片土地上。南京城内，曾经的辉煌已被战争摧毁殆尽，残垣断壁诉说着无尽的痛苦与牺牲。在那些瓦砾之间，偶尔还能看见半幅褪色的楹联，墨迹被雨水洇成一团模糊的影子，像是一个时代临终前没能写完的遗言。\n\n国共双方虽然在废墟之上达成了停战协议，但彼此之间的猜疑与敌意未曾消弭。\n\n两党在各个议题上的高度分歧，使得这个新生的国家如同一艘在风雨中摇摆的巨轮，船身的裂痕交错，而甲板上的人却在为航向争执不休。远方天际线上，乌云正在酝酿一场新的风暴。而这艘巨轮，仍在两股主要力量的对峙中，等待着它真正的航向——或者，等待着下一道将它彻底撕裂的惊雷。"
COX_Try_Traitors: "审判伪廷"
COX_Try_Traitors_desc: "祖国的大半领土虽已光复，但附骨之疽并未随之一扫而空。在民族危亡的至暗时刻，那些背弃信仰、投靠外敌的汉奸走狗，甘愿沦为侵略者的帮凶，助纣为虐，屠戮同胞，他们的罪行罄竹难书，他们的背叛会永远刻在历史的耻辱柱上。\n\n南京将设立联合特别法庭，审判汪伪政府的主要成员。对这些叛徒的正义审判，是对他们滔天罪行的清算。无论他们曾经身居何等高位，无论他们曾经多么受人尊敬，他们都必须为自己的背叛付出代价。\n\n这不仅是对受害者的安慰，更是对整个国家的警示。只有通过审判伪廷，才能让那些心怀不轨的人知道，中华民族是不可征服的，任何背叛国家的人都将受到最严厉的惩罚。"
COX_Wash_Away_The_Filth: "涤荡馀腥"
COX_Wash_Away_The_Filth_desc: "战争结束了，但战争的腥臭味还未散去。\n\n它附着在被炸毁的城市上，附着在乡间的万人坑里。而最污秽的，是附着在那些尚存活的人身上。那些下达命令的日本军官，那些实施酷刑的宪兵，那些靠着被掠夺的资源大发横财的商贾。他们穿着不同的制服，却侍奉着同一个主子。\n\n现在，他们被关进了铁牢。他们狰狞的面孔，曾是恐怖的象征，如今只是沮丧的阴沉肖像。怪物们被关进了笼子。\n\n但关押他们只是最简单的部分。接下来呢？那些被饥饿和暴行折磨了十几年的人民，在大声疾呼，要求鲜血。要求公开处决。要求一场只有通过复仇才能获得的宣泄。\n\n这一次，南京的各方代表没有分歧。审判战犯，是派别之间少有的、毫不犹豫的共识。法庭上的审判席，左派和右派并肩而坐。那些被押运到庭的战犯，面对的不再是一个分裂的中国，而是一个在国难面前短暂地合拢了裂痕的民族。\n\n但审判落幕之后，还有更难的事。战争的创口引来了苍蝇——溃散的伪军、趁乱而起的山匪、各种在角落中迅速繁殖的武装团伙。他们盘踞在乡间无恶不作。军事指挥权的不统一让剿匪工作困难重重，但这件事非做不可。一个连基层秩序都建立不了的国家，是没有资格谈重建的。"
COX_The_Homeland_Shines_Anew: "国土重光"
COX_The_Homeland_Shines_Anew_desc: "随着最后一场公审落下帷幕，百年来的屈辱与血泪被淹没在烈士的尸骨之下，而统一的中国旗帜盖在他们身上。从喀什的戈壁到阿穆尔的雪原，从东南的渔村到漠北的草原，中华民族终于拥有了统一跳动的心脏。\n\n眼下，饱受折磨的中国未从病痛中恢复，殖民与同化的阴影仍需时间消散，各地的饥荒与瘟疫仍亟待处理，几近崩溃的国民经济更让人寝食难安。北方虽在战时便已开始重建行政机构、登记人口、分发救济粮，政府内部的混乱却使得重建工作难以进一步开展。\n\n但若我们看向前方，对于战胜了列强与日寇的五万万人民来说，这些因难终究会被克服。\n\n遭受重创的日本无力威胁我们，大洋彼岸的美国对我们充满兴趣，北方的苏维埃更对我们的胜利由衷喜悦。中国人民终将自豪的重回世界舞台。\n\n一唱雄鸡天下白，万方乐奏有于阗，诗人兴会更无前。"
COX_Unfinished_Business: "未竟之事"
COX_Unfinished_Business_desc: "1931年9月18日，东北的夜空被炮火撕裂，关东军以区区借口发动突袭，仅四月光景，锦绣黑土尽数沦陷。傀儡政权登场，日寇的铁蹄践踏三千万同胞，十四载苦难铺满山河。亡国的屈辱，沉重地压在每一个东北人的肩头。\n\n如今，战局生变，祖国大地迎来解放曙光。然则东北依旧在敌手掌控之下，攻势受阻，前线静默。战士的目光却从未离开那片故土，旧抗联的残部在西北集结，故人重逢，誓言未改。游击队于白山黑水间潜伏，地下组织在长春、哈尔滨、沈阳的阴影中积蓄力量，静待时机。\n\n秩序正在松动，裂隙逐步显现。日寇管理不善，伪政权已是风雨飘摇。西满洲将成为突破口，游击队与抗联老兵汇合，筹划反攻。战旗终将再度升起，硝烟将在白山黑水间燃烧，旧恨未消，新仇已至，东北的回归，已在路上。"
COX_In_The_National_Assembly: "庙堂之上"
The_National_Assembly_tt: "我们将召开§z国§!§x民§!大会……"
COX_Economic_Integration: "经济一体化"
COX_Economic_Integration_desc: "目前革命事业已取得成功，建设事业成为中央与地方政府及全国各党派的主要要务。然而，当前的财政体系却支离破碎。各地财政独立，税收分散，资源配置效率极低，甚至出现了私立税目和横征暴敛的现象。中央政府难以有效调配各地资源，地方政府则缺乏足够的资金支持战后重建和赈灾事宜。\n\n国民大会必须采取行动，建立一个统一的中央财经部门。意识形态上的严重分歧虽不可避免地导致了该采取何种经济政策的争议，但并不意味着我们无法在现阶段达成共识，共产党仍然愿意遵循孙中山先生的遗教——“平均地权”和“节制资本”的原则。在三民主义这个最大公约数的约束下，国共两党将牵头组建一个财政经济委员会，负责制定和执行统一的经济政策和财政体制，推动国家经济的一体化进程。"
COX_Rebuild_In_Documents: "纸上重建"
COX_Rebuild_In_Documents_desc: "联合政府的首要工作重点，是恢复遭受重创的国民经济。\n\n生产倒退、交通破坏、金融崩溃……财政经济委员会每一天的报告都堆积成山。得益于先前的经济统合工作，国家得以以统一的名义对重建项目进行规划协调，从发电厂的选址到铁轨公路的修缮，一份份政府公报都力图向人民宣告一切都在有条不紊地进行。单从纸面上看，重建工作似乎正在迅速推进。\n\n在千里之外的武汉，工地上却一片死寂。枕木没有运到，因为邻省还在为钢轨的规格争吵；钢筋还堆在港口，因为没人决定该使用苏式标准还是美式标准；这只是一个缩影，类似的情况在全国层出不穷。\n\n中国的复兴，注定要在这样的磕磕绊绊中，走过一段远比预想漫长的道路。"
COX_Dissension: "秤砣之争"
COX_Dissension_desc: "当前的政治格局已经形成了一个微妙的平衡。国共两党在议会中势均力敌，任何一方都无法单独掌控局面。\n\n仿佛一杆两端都摆满了筹码的天平，这不是静态的，而是双方锱铁必较的结果。\n\n我们的党和其他任何政党一样，力图为自己争得政治上的统治。但也必须承认，经过烽火连天的岁月，和平统一才是群众和社会的希翼。不过这并不意味着共产党人会坐以待毙，我们将争取各民主党派，动用规则内的一切手段，以争取在己方一侧加上一枚秤砣。\n\n这是一场无声的冲突，它不在战场上进行，而在人事任免的名单里，在深夜签署的法令中，在对某项预算的拨款额度上。我们的每一次胜利，都让天平向着革命的终点滑近一寸；对方的每一次阻挠，都让中国那模糊不清的未来延长了一天。\n\n中国的命运，就在这枚秤砣的来回滑动中，摇摆不定。目前，它奇迹般地维持着平衡。但所有人都知道，这只是暂时的。"
COX_Army_And_Country: "军与国"
COX_Army_And_Country_desc: "铁与火淬炼出的军队，本该是国家意志的延伸，维护领土完整、捍卫民族尊严。然而，今日之局势却令人警醒——军权分散，战旗交错，国防体系支离破碎。国家直属部队数量微薄，难以支撑稳定局势。\n\n西北之地，镰锤旗飘扬，人民红军自成体系，游离于国家体制之外；南京近郊，护国军与国民党的军队各据一方，黑天血日旗与青天白日旗混乱交织，军令无法统一，指挥权形同虚设。这片土地上，每一支部队都有自己的信仰和主张，却缺乏一个共同的意志。若无变革，内耗无可避免，国防现代化将无从谈起。\n\n国民大会必须出手。各党派的武装力量必须被整合，零散的军权必须收束至国家之手。唯有如此，军队才能真正服务于国家，战争机器才能高效运转，国家安全才能得到保障。任何犹豫与拖延，都是对未来的怠慢。历史不会容忍懦弱，时代不会等待迟疑，军与国的统一，势在必行。"
COX_Uncontrolled_Ocean: "有海无防"
COX_Uncontrolled_Ocean_desc: "从庙街的冻土到北部湾的椰林，我国有着约30000公里的海岸线，但原有的海防体系已经荡然无存，“归功于”伪政府的废弛军备，旧有的防御工事早已失修，海防装备供不应求，能开动的舰只更是屈指可数。敌人的舰队可以轻易地在沿海地区上游弋，对我们进行封锁、禁运，甚至直接对商船开火。\n\n沿海城市的居民生活在危险之中，渔民们不敢出海，商船也不敢靠岸，国民经济和人民生产生活受到了严重的影响。\n\n国民大会必须采取行动，中国共产党将提出一项特别议案，紧急修筑海防工事，协调就近驻地的两党部队在海岸线上联合布防，加强沿海地区的防御能力。现在不是争权夺利的时候，任何拖延和犹豫的行为，都是纵容对人民权益的侵犯。"
COX_Not_Passed: "虚席议政"
COX_Not_Passed_desc: "国民大会的召开从来都座无虚席。\n\n没有具体规定要求议员们按照何种方式落座，但是每一次开会却总能发现——不同党团的代表们往往各自聚拢，泾渭分明，像隔着一道天堑。所有人都在这里，一个都不少。\n\n然而，最重要的那个席位，却是空的。\n\n那不是一个实体上的空缺，而是一个精神上的黑洞。它盘踞在议会大厅每个人的脑海里。它代表着一个致命的问题：我们究竟在建设一个什么样的国家？\n\n议政开始了。他们讨论税率，讨论路权，讨论教科书的修订。每个议题的措辞都要经过反复修改，日常的政务往往在唇枪舌剑中举步维艰，才能勉强通过。\n\n这是一个完整的政府，它拥有所有必需的部门和人员。但这也是一个残缺的政府，它仍然缺乏共同的灵魂。"
COX_An_Insurmountable_Gap: "江舟难渡"
COX_An_Insurmountable_Gap_desc: "一条大江横亘在我们面前。\n\n它不是由水构成，而是由意识形态、猜疑与尚未干涸的血构成。江的一边，是旧的世界，是褪色的共和国幻影；另一边，是崭新的世界，是通往光明的唯一蓝图。\n\n而我们，就乘着一艘名为“联合政府”的扁舟，航行于江心。\n\n立于当下这片崎岖的礁石之上，遥望对岸那座象征着权力的殿堂一那是我们共同的目标，也是斗争的终点。那里有我们规划好的一切：水坝、铁路和没有饥谨的未来。\n\n但船上的水手是昔日的死敌，他们宁愿凿穿船底，也不愿让对方掌舵。每一次政策的推行，都像是用一支小小的船桨，去对抗咆哮的、名为“不信任”的激流。\n\n江水很宽，暗流很急。我们能否抵达对岸，还是在这江心之中倾覆，都只在一念之间。"
COX_A_Helpless_Peace_Dove: "脆弱的纸鸢"
COX_A_Helpless_Peace_Dove_desc: "议案停滞，军队四分五裂，经济结构依旧断裂，新国家仍未找到稳定的航向。政治博弈未曾停歇，利益角力层层交织，旧秩序的阴影挥之不去，新的制度框架尚在挣扎成形。\n\n尽管前路未明，微妙的变化已悄然发生。更多议员开始携手，共同推动国家机器运转，裂痕虽未愈合，方向却逐渐清晰。改组接近尾声，修宪即将落锤，沉寂已久的大会堂将再次回响正式会议的声音。新生政权站在分水岭上，等待的是重塑国家结构的关键时刻。\n\n未来的走向仍未定夺，妥协与博弈仍在进行，政坛的空气充满不安。两党维系的政治平衡能否支撑国家前行？分裂的根源是否会在风暴来临之际彻底撕裂脆弱的结构？大厦将成，抑或再度坍塌，一切的答案终将交由时间书写。"
