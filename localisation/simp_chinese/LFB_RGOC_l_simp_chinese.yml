#ministers
CHI_Zhao_Zunyue_hog_desc:0 "§Y副总统\n左翼法团主义§!\n--------------\n"
#events
 LFB_RGOC.1.t: "黯然退场"
 LFB_RGOC.1.desc: "（占位）陈公博对于自己“鞠躬尽瘁”（大嘘）却换来这种结局愤愤不平，那群刁民不知道自己为他们做了多少努力，那群狗一样的同僚也只会幸灾乐祸，明明天灾是无可避免的，为什么要把问题怪罪到他头上？他妈的，难道你周佛海来就能干的更好？他蒋介石来就能干的更好？还骂他“赤匪”，赤匪来也不会比老子干的更好！（没点逼数了这人）陈公博越想越气，最后只能把问题归结于中国人的劣根性，不懂得感恩的民族配不上他这种伟人。（经典不找自己的问题）"
 LFB_RGOC.1.a: "中国人不感谢陈公博。"
 LFB_RGOC.2.t: "荣登大宝"
 LFB_RGOC.2.desc: "（反正玩家看不到不写了，大致就是牢高对自己被推出来非常惊讶，三更半夜睡不着）"
 LFB_RGOC.2.a: "此即为妥协的艺术。"
#news
 LFB_RGOC.1001.t: "[Get_newspaper_header]海河大洪水"
 LFB_RGOC.1001.desc: "尽管大多数专家的分析预测都表明，连日来华北海河流域的暴雨很可能会引发大范围的水灾，但没人预料到这场灾难的规模会如此之大：天津近乎成为汪洋，冀中与冀南的绝大多数城镇更是完全与外界失联，仅可统计的死伤人数就已逼近十万。甚至有渔民声称自己在海面上看到了成片的尸体和垃圾，少数胆敢进入灾区的记者更是传回了一幅幅如同地狱般的景象。\n\n被寄予厚望的当地水利系统在洪水面前不堪一击，纷纷决堤或倒塌，令舆论指责南京当局的失职造成了大量不必要的损失。随着洪水逐渐消退，当地基础设施近乎完全被毁，大量村庄被夷为平地，数千万人流离失所，无家可归。也许，本就摇摇欲坠的南京改组派政府很快将要面临又一场滔天巨浪。"
 LFB_RGOC.1001.a: "又一个王朝的气数将尽……"
 LFB_RGOC.1001.b: "善后救济部的人都滚去哪了？"
 LFB_RGOC.1002.t: "[Get_newspaper_header]陈公博引咎辞职"
 LFB_RGOC.1002.desc: "40年代末汪精卫死后，时任改组政府立法院长的陈公博成功击败了诸多觊觎者，登上总统宝座。然而，自50年代其颁布一系列社会改革法令以来，反对与质疑之声就从未断绝：一些人认为他的改革收效甚微，另一些人则接称其为“赤匪”。虽然得益于改组派在党内的扎实地位，陈公博得以顶住两方面的压力暂居总统大位。然而，频频发生的自然灾害一次次沉重地打击了改组派，而当局救灾不力、劳民伤财，致使民怨沸腾、党内震怒。63年这场破坏力空前的大洪水更是成为了压垮骆驼的最后一根稻草，在多方声讨下，陈公博最终选择引咎辞职，结束了他饱受争议的总统生涯。\n\n依据宪法，总统大任自然就落到了副总统赵尊岳手中。虽然外界对其人知之甚少，但可以肯定的是，无论他接下来有什么打算，第一步必定是处理前任留下的烂摊子。"
 LFB_RGOC.1002.a: "此所谓奉命于危难之间。"
 LFB_RGOC.1002.b: "不过是换了个傀儡登台唱戏。"
 LFB_RGOC.1003.t: "[Get_newspaper_header]中国政坛风云暂歇"
 LFB_RGOC.1003.desc: "陈公博总统黯然辞职后，海内外均翘首以待何人可居总统宝座。而今日尘埃落定，国民大会选举高宗武接任总统一职，消息一出，朝野哗然。\n\n高宗武，素来无强大派系为依托，于党内亦行止低调，乃至一度被视作“边缘人”。然政事之妙，出乎常理。据前特高课高官私下透露，此番安排，实为党内诸派博弈后所达成之一种“无害妥协”。\n\n然而，无人知晓风平浪静的表象能维系几时。高氏虽荣登总统之位，其能否驾驭国内大势、调和党内诸般分歧、提振中国之国运？其所谓“五个现代化”的愿景又能否化作现实？一切仍有待时间检验。"
 LFB_RGOC.1003.a: "履新易，治国难。"
 LFB_RGOC.1003.b: "他真以为自己是勾践？"
#国策
l_simp_chinese:
  New_Year_Begins:0 "新春伊始"
  New_Year_Begins_desc:0 "新春伊始，万象更新。随着新的一年来临，国民政府必须把握时机，开启新一轮的现代化进程。"

  Contact_Malaya_Evacuation:0 "联系马来亚撤侨"
  Contact_Malaya_Evacuation_desc:0 "一旦局势失控，我们必须准备好疏散我们在马来亚的侨民，保护他们的生命与财产安全。"

  Hello_Japanese_Prime_Minister:0 "你好，日本首相"
  Hello_Japanese_Prime_Minister_desc:0 "与日本首相的直接沟通，将为两国间的协作与理解铺平道路，确保帝国对华政策的延续性。"

  Another_Victory:0 "又一次胜利"
  Another_Victory_desc:0 "在无数次政治与经济的博弈中，我们再次取得了阶段性的胜利，这证明了我们路线的正确性。"

  Discuss_New_Plan:0 "商讨新计划"
  Discuss_New_Plan_desc:0 "旧有的经济框架已难以满足当前需求，政府内部需要共同商讨一套全新的发展计划。"

  Convene_National_Economic_Committee:0 "召开全经委"
  Convene_National_Economic_Committee_desc:0 "召开全国经济委员会会议，协调各部门的利益与资源，为经济腾飞奠定制度基础。"

  Southeast_Move:0 "落子东南"
  Southeast_Move_desc:0 "落子东南，将发展重心向东南沿海倾斜，利用海路贸易与侨乡优势推动经济快速增长。"

  Last_Years_Report:0 "去年的报告"
  Last_Years_Report_desc:0 "回顾去年各部门提交的成效报告，以数据为依据，为下一步决策提供参考。"

  Collect_Opinions:0 "收取意见"
  Collect_Opinions_desc:0 "广泛听取各界代表、技术官僚与地方士绅的意见，确保政策的制定能够兼顾多方利益。"

  Coastal_Primary:0 "沿海为主"
  Coastal_Primary_desc:0 "优先发展沿海港口城市，建设现代化工业园区，打造对外经济开放的桥头堡。"

  Riverine_Secondary:0 "沿江为辅"
  Riverine_Secondary_desc:0 "在沿海开发的同时，适度发展沿长江及主要河流的内河经济带，形成次级增长极。"

  Maintain_Stability:0 "保持稳健"
  Maintain_Stability_desc:0 "在快速发展中，必须确保社会秩序的稳定，避免因过度改革引发不必要的动荡。"

  Maintain_Growth:0 "保持增长"
  Maintain_Growth_desc:0 "保持经济的高速增长态势，通过持续投资基础设施与优化产业结构，实现可持续发展。"

  Reevaluate:0 "再次评估"
  Reevaluate_desc:0 "在计划执行中期，我们需对现有政策进行重新评估，及时纠正偏差，确保最终目标的实现。"

  Seek_No_Merit_Avoid_Faults:0 "不求有功，但求无过"
  Seek_No_Merit_Avoid_Faults_desc:0 "在当前复杂的政治环境下，维持现状，避免激进改革带来的风险，或许是更为稳妥的选择。"

  National_Assembly_Election:0 "国民大会选举"
  National_Assembly_Election_desc:0 "通过国民大会选举，巩固政权的合法性，同时为未来的政治改革铺路。"
