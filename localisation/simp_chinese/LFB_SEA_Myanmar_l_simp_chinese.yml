##ideas
#缅甸政府军
MYA_poppies_ocean: "罂粟花海"
MYA_poppies_ocean_desc: "到处都是罂粟田，到处都是罂粟花，到处都是割果实的孩童……鸦片的巨额利润让这片土地上的所有势力都眼红，只要一块土地，一些耕作的老农，再加上一点点罂粟花种子，就能够榨出巨额的利润，至于粮食？没人会喜欢赚不了大钱的东西。军阀在种它，土司在种它，中央政府派下来的官员也叫下属种它……这土地上有头有脸的人物都在种，乃至于反对这些人的游击队们……\n\n§e于是，罂粟花肆意盛开。§!"
MYA_white_sun_shines_in_Myanmar: "白日耀缅"
MYA_white_sun_shines_in_Myanmar_desc: "在那场帝国建立大东亚共荣圈的伟大远征结束后，缅甸的总督却头疼地发现，随着旧国民政府的轰然倒塌，自己所管辖的境内出现了一支战斗力强劲的军队，他们隐藏在丛林里，像恶鬼一样收割着北方头人们的生命，起初还只以为是哪支精锐的游击队，可前线却传回他们与游击队并肩作战的报告。要想将他们与土邦游击队区分开来很容易，他们独特的旗帜让他们的历史一览无余。\n\n那是一面§z青天§!§W白日§!§x旗§!。"

