#news
LFB_SEA_Myanmar.1001.t: "[Get_newspaper_header]缅北暴乱"
LFB_SEA_Myanmar.1001.desc: "据前线消息，一支身份不明的华人武装突然出现在缅北地区，打着"国民革命军"的旗号，迅速对政府军发起攻势，突破缅军防线，一度逼近仰光郊区，并与当地多支游击队形成配合，导致政府军节节败退。然而，几天后战事突然平息，这支武装似乎悄然撤离，去向不明。  \n\n该武装的背景和意图尚不明确，而更令人疑惑的是，缅甸政府至今未对此事作出任何公开回应，既未谴责，也未采取军事行动。外界担忧，若北部冲突持续升级，缅甸可能陷入更大规模的动荡，现有秩序或将面临严峻挑战。"
LFB_SEA_Myanmar.1001.a: "国民党的军队？他们和南京是什么关系？"
LFB_SEA_Myanmar.1002.t: "[Get_newspaper_header]昂山遇刺"
LFB_SEA_Myanmar.1002.desc: "今晨，缅甸总统府发生重大刺杀事件。昂山总统与国防部长波木昂被发现在办公室内身亡，现场有明显打斗痕迹。初步调查显示，行凶者可能来自极端民族主义组织"爱国党"下属武装力量。\n\n"爱国党"长期与昂山政府对立，其领导人吴素自40年代起就与昂山存在政治恩怨。该党推崇排外政策，主张民族纯粹性，其纲领被指模仿欧洲法西斯政党，多次引发国际社会批评。  \n\n尽管尚无直接证据表明吴素下令行刺，但分析人士指出，此次事件与近期北部叛乱存在关联。总统与防长同时遇害导致缅甸权力核心真空，军政系统陷入瘫痪，目前缅甸全国各界保持沉默。  政治观察家表示："缅甸政局的稳定基石已被击碎，其未来局势可能彻底失控。""
LFB_SEA_Myanmar.1002.a: "缅甸的麻烦。"
LFB_SEA_Myanmar.1003.t: "[Get_newspaper_header]缅甸内战"
LFB_SEA_Myanmar.1003.desc: "昂山的殒命为这个早已四分五裂的国家再添了一把火；而现在矛盾已经再也掩盖不住了——据前线报道称，缅甸各处早已再次陷入战乱之中。各地土邦与军阀政客你方唱罢我登场，纷纷想在这片土地上谋得一份利益。我们虽无从得知哪个政治势力将再度统治缅甸，但我们可以唯一得知的是：这一次，新宪法和缅军或许再也无法保护缅甸了。"
LFB_SEA_Myanmar.1003.a: "好机会，快叫南方局的同志接电话！"
LFB_SEA_Myanmar.1003.b: "又一个国家殒于战火。"

#anarchy_GUI
TNO_anarchy_MYA_tt: "§e噬人§!§n雨林§!"
TNO_anarchy_MYA_tt_delayed: "枪炮的硝烟连尸体的腐臭也能盖住，茂密的雨林却再也藏不下失措的人群。\n\n国民党残部孤注一掷的进攻，彻底打乱了缅甸脆弱的秩序平衡。而昂山与其国防部长遇刺一事，则彻底将缅甸这片土地的安宁搅得稀碎。本就疲于镇压各地游击的中央军队彻底失能，不安定的北方各地烽火四起，地方上的豪强、政府里的异见者、土邦中的反抗者尽数露出獠牙，彼此大打出手。在南方，政府所管辖的地区也正被不断蚕食——而引起这一切的国民党却发现自己根本没有掌控局势的能力，他们只得选择后撤整顿。\n\n高烈度的战争使缅甸再无和平，哪怕是一块农田在一天内都可能三易其手，自此，这片土地的秩序已烟消云散，只有如同无穷烈焰一般的战争灼烧着这篇土地上的每一个人……"

#dynamic_modifiers of states
Myanmar_KMT: "§z国民革命军§!控制区"
Myanmar_KMT_tt: "§F在将乱云纷飞的二十世纪拦腰折断的那几年里，备受史学家青睐的话题无非是第二次世界大战的余波消逝、苏联在政变与地方叛乱中被撕裂以及新秩序在三级的主导下建成。至于那轮曾照耀大半个中国的青天白日，早已和布哈林的红星、中欧的旧地图一并被当作历史的注脚，被归档，被遗忘。\n\n而有一支深知自己命运的部队，他们当下最为迫切的愿望便是向世界昭告这青天白日仍在人间。然而，十年北伐，十年抗战，十余年颠沛流离，从他们在瘴气环生的密林中踏过国境线的那一刻，他们早已成为弃子。同样奔腾不息的清澈河水被国境线分成了怒江与萨尔温江，同样饥寒交迫的民众被国境线分成了南京政府与缅甸政府的子民，而眼神不再坚定的儿女们在国境线那边是抵抗军，在国境线这边则是孤军残阵，是各色势力的眼中钉、肉中刺。\n\n作为这支缅北孤军的首领，孙立人绝非什么理想主义者。一个为复国大任矢志不渝的理想主义者统领不了这样一支部队——这里有来自渤海湾旁饱经沧桑的老兵，也有家在云南、不堪亡国之辱愤然随孤军转进的新兵蛋子；这里有人誓要杀光从南境蛮夷到东洋倭寇的一切异族，也有人在胸上同时别着孙文与列宁的头像，时刻鼓捣电台上的旋钮，寻找着辗转流亡在北境的同志们的音讯。孙立人本人也是矛盾的。军中的三种主要主张：反攻云南、割据缅甸、投诚散伙，孙立人都看在眼里。然而，此前向云南境内发起的袭扰并不奏效，只是白白损失了部队。事到如今，似乎只有一条路可走：盘踞在缅北这片仰光暂时鞭长莫及的权力真空带，在这支人丁逾万却缺衣少食的孤军彻底沦为乌合之众前保存实力。他们焦急地等待着北方的云南或南方的仰光的一点点风吹草动，一旦时局再度迷乱，那便是“国民革命军”这个沉寂已久的名号重新响彻的最好时机。§!"