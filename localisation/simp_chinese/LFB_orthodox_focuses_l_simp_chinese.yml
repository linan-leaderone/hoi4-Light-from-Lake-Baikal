l_simp_chinese: 
#正统线国策树
 COX_the_hour_of_crisis: "危急关头"
 COX_the_hour_of_crisis_desc: "来自西南与兰州的无线电波中带着令人窒息的噩耗。敌人的装甲洪流已撕破外围防线，整个西北大地都在战栗，现在是时候直面这即将降临的灾难了。"
 COX_the_frontline: "前线"
 COX_the_frontline_desc: "西宁是阻挡敌军西进、窥伺新疆的最后一道大门。如果西宁失守，广袤的西北平原将无险可守，后方的土改成果与工业萌芽也将被彻底践踏。我们必须把一切可用的枪支、每一颗子弹以及最后的预备队推向最前沿。在冰冷的祁连山脚下，一道由血肉与泥土筑成的长城必须拔地而起。"
 COX_the_home_front: "后方"
 COX_the_home_front_desc: "当前线在流血时，新疆的工厂、农村与矿山必须成为源源不断输送战争资源的动脉。妇女将走进工厂顶替奔赴前线的丈夫，老人将套上马车运送粮食。在这场决定中国革命生死存亡的考验中，后方没有旁观者，整个新疆都将转化为一架超负荷运转的战争机器。"
 COX_reorganize_red_guards: "整编赤卫队"
 COX_reorganize_red_guards_desc: "兰州之战的惨烈超乎想象，败退下来的赤卫队几乎失去了原有的编制：建制被打散、基层政工干部严重缺失、伤员满营。但他们是经历过熔炉考验的火种。现在不是哀悼的时候，我们必须打破原有的番号，将这些疲惫但满腔仇恨的战士重新编组，补充武器，让他们再次成为前线最坚硬的骨骼。"
 COX_fortify_positions: "铸垒"
 COX_fortify_positions_desc: "马家军留下的旧防御工事太过粗糙。我们需要在原有的地基上，利用西宁周边的地形，重新构筑坚固的防御堡垒。每一面城墙、每一道堑壕，都将是我们阻挡敌军推进的血肉关口。"
 COX_fill_the_granaries: "填满粮仓"
 COX_fill_the_granaries_desc: "新疆的土改虽然带来了粮食的增产，但面对漫长而惨烈的围困，这还远远不够。我们必须推行极端的‘战时余粮征集制’。派遣工作队下乡，政工干部们必须耐心地走入每一个村庄，向刚刚获得土地的农民解释——如果政权亡了，地主会回来，一切都会失去。为了保卫胜利果实，我们必须先把粮仓填满，在保证群众最低生存口粮的前提下，强行征收一切结余。这会引起动荡，但为了前线战士不饿着肚子战斗，我们别无选择。"
 COX_hidden_supply_lines: "隐蔽交通线"
 COX_hidden_supply_lines_desc: "现有的新疆与青海之间的主要交通线不仅稀少，而且极易被破坏。为了保证前后方的生死命脉，运输队和筑路工必须冒着生命危险，在玉宇琼宫间强行开辟出几条极其危险、地形恶劣但能躲避敌袭的隐蔽路线。哪怕是用人背马驮，物资也必须送上去。"
 COX_lessons_in_blood: "血的教训"
 COX_lessons_in_blood_desc: "过去为了对抗共同的强敌，我们收容并联合了各路地方军阀武装以及国民党的残部。然而，各自为战、指挥不灵的弊端在兰州战役中暴露无遗，并让我们付出了血的代价。这样的悲剧绝不能重演。在这个生死存亡的时刻，必须建立绝对统一、高效的红军指挥体系。"
 COX_guerrilla_warfare: "游击运动战"
 COX_guerrilla_warfare_desc: "大兵团对抗绝非我们所长。利用祁连山脉和荒漠戈壁的复杂地形，派出小股精锐迂回敌后。提前勘测地形，建立藏匿点，随时准备骚扰、切断敌军的补给线，用漫漫长夜的游击战拖垮他们的锐气。"
 COX_hoard_weapons: "囤积武备"
 COX_hoard_weapons_desc: "迪化的兵工厂在全力以赴地轰鸣，但这远远不够。我们必须动用一切手段，通过西伯利亚的黑市、走私网络以及任何能联系上的渠道，哪怕是用珍贵的矿石和黄金去换，也要换来枪支、电台和维护工具。我们要把每一个仓库、每一间地窖都塞满武器，无论是新造的还是缴获的旧货。"
 COX_dispersed_production: "离散生产"
 COX_dispersed_production_desc: "在绝对的空权劣势面前，集中在大型城镇的工业区无异于敌方轰炸机的活靶子。利用后方幅员辽阔、战略纵深广大的优势，把大型工厂拆解，将车间机床分散搬迁至荒漠、峡谷甚至是偏远的村落之中。"
 COX_iron_wall_of_northwest: "西北铁壁"
 COX_iron_wall_of_northwest_desc: "工事已经加固，指挥已经统一，战术已经传达。虽然面对敌人铺天盖地的飞机坦克，仅凭血肉之躯，根本挡不住他们，但知道归知道，战线中却没有人后退。因为在他们身后，是中国革命的曙光，是待燎原的烈火。纵使这道铁壁终将破碎，我们也必须崩掉敌人几颗带血的牙齿。"
 COX_preliminary_preparations: "初步备战"
 COX_preliminary_preparations_desc: "余粮被强行征走，工厂在战火阴影下拆迁，高强度的劳作与对战争的恐惧在基层蔓延，不可避免地引发了局部的动荡与骚乱。但工作已经完成，纵使内部压力重重，但全面戒备的框架已经搭建完毕。"
 COX_all_that_can_be_done: "人事已尽..."
 COX_all_that_can_be_done_desc: "至此，我们已做好了准备。整个苏区军民已被动员起来以应对这前所未有的威胁。\n我们已经做了能做的一切…但是…我们真的能战胜他们吗？"
 COX_meet_the_assault: "迎接冲击！"
 COX_meet_the_assault_desc: "你听到数百架飞机的轰鸣声了吗？\n你听到上百辆战车的隆隆声了吗？\n那就是他们来了，吃人的野兽来了。\n拿起武器！不做锤子，就做砧板！\n不做锤子，就做砧板！"