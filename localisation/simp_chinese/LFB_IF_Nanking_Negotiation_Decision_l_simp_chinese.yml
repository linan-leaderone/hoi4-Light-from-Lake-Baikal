 LFB_category_desc: "\n£GFX_texticon_LFB\n\n\n\n\n经历了艰苦卓绝的抗战斗争，中国终于重新获得了自由；然而，两党暂时放下的争执与分歧，此刻又不得不得摆上台面来。是走向联合，还是分道扬镳？一切，都要由这场会议来决定。\n\n和谈中，不同决议会影响意向值的增减。双方必须同时要达到§G较为愿意§!及以上的等级，和谈才能成功；如果某一方的意向值达到了较低的程度，将会引发§R一些不可预计的后果§!……\n\n"
