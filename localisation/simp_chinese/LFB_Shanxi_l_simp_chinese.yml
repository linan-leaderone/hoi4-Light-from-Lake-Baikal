l_simp_chinese:
SHX_ash_of_red: "赤烬"
SHX_ash_of_red_desc: "§R赤匪好像离开了陕西，然而好像处处又有他们的身影……§!§F\n--------------\n§!太原的老爷们无法在打碎边区生产制度后在陕北的田亩中收上税来，也无力进攻死灰复燃的南泥湾根据地，最终只能把陕西草草丢给了傅作义。但不论是身居太原的阎锡山继业者们还是屯兵西安的傅作义，他们心中都清楚一个事实：\n§x那些人§!§e很快就会回来。§!"
SHX_coal_mining_of_Shanxi: "晋陕煤业"
SHX_coal_mining_of_Shanxi_desc: "§R燃烧着的晋陕为他人提供源源不断的煤炭，仿佛她的使命就是如此……§!§F\n--------------\n§!在晋陕行政公署糟糕的管理下，遍布大同的矿井总是在吞噬一条条鲜活的生命，但煤矿又偏偏是晋陕公署为数不多的好腿。既然共党已经被消灭了，多压榨一点工人自然也不会有人在乎，只要还能产出煤炭，南京就不会放着晋陕不管。"
SHX_motley_crew: "乌合之众"
SHX_motley_crew_desc: "与其说晋军是一支军队，不如说是给地痞流氓与纨绔子弟凑在一起花天酒地的大烟馆或者大赌场，兵员素质低下乃至于无法开展最基本的队列训练，更遑论射拼刺击等专业技术。这群丘八欺行霸市轻车熟路，但若无日军带领则根本不敢踏进赤匪活动区半步，这样的军队怕是武安君再世也要头痛。"
SHX_conflicts_between_officials: "参商之隙"
SHX_conflicts_between_officials_desc: "阎锡山死后留下的太原小朝廷内，两股政治力量针锋相对、争权夺利，它们推举出来的领导人名义上是矛盾的调和者，但实际上只是掩盖斗争的遮羞布。\n\n大量的政治经济资源被投入毫无意义的争斗中，沆瀣一气的官僚地主集团自然也收不了多少税来。如此这般，稍稍有些良心抱负的人们纷纷离开了太原。"