l_simp_chinese:
SHX_ash_of_red: "赤烬"
SHX_ash_of_red_desc: "§R赤匪好像离开了陕西，然而好像处处又有他们的身影……§!§F\n--------------\n§!孱弱的晋陕行政公署既无法肃清伪政权内部的共党，也无法在打碎边区生产制度后在田亩中收上税来，更遑论进攻死灰复燃的南泥湾根据地，除非与日本人在一起，不然丘八们说什么也不愿意离开温暖的军营。\n这样相安无事倒也各自安好，但在他们心底有一个如梦魇般挥之不去的声音始终在低语：\n§x那些人§!§e很快就会回来。§!"
SHX_big_mice: "硕鼠"
SHX_big_mice_desc: "整个晋陕的良家子在赤匪败退后似乎人间蒸发了，现在大街上招摇过市的警察是地痞流氓，庙堂上脑满肠肥的是汉奸走狗，向士兵训话的军官更是五毒俱全，谁叫晋陕公署的头头也是最大的硕鼠呢？"
SHX_coal_mining_of_Shanxi: "晋陕煤业"
SHX_coal_mining_of_Shanxi_desc: "§R燃烧着的晋陕为他人提供源源不断的煤炭，仿佛她的使命就是如此……§!§F\n--------------\n§!在晋陕行政公署糟糕的管理下，遍布大同的矿井总是在吞噬一条条鲜活的生命，但煤矿又偏偏是晋陕公署为数不多的好腿。既然共党已经被消灭了，多压榨一点工人自然也不会有人在乎，只要还能产出煤炭，南京就不会放着晋陕不管。"