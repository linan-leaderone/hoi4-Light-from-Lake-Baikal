l_simp_chinese:
  America_KMT_tt: "£GFX_modifiers_America_KMT_icon\n\n旭日的阴影仍笼罩着中国大地，可"委员长"的名号却早已在大洋彼岸冷却。那些自诩为所谓"继承者"、"解放者"的人，只不过是蜷缩在华盛顿的阴影里的丧家之犬，啃食着早已腐朽的权力残羹。由钢铁与谎言铸就的"流亡政府"，不过是苟延残喘的空壳；那些曾响彻云霄的"反攻"口号，早已沦为哄骗残部的催眠曲。\n\n被充分解构的"三民主义"口号仍时不时盘旋在南京城上空——但那不过是供人耻笑的历史余烬而已。\n£GFX_modifiers_KMT_sun_ke £GFX_modifiers_KMT_song_mei_ling"