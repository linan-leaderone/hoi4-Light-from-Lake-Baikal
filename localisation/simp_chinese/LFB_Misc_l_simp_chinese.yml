 COX_the_sunrise_of_north_NAME: "北境日升"
 COX_the_sunrise_of_north_DESC: "“当年个老李下乡来，\n夜打灯笼走山崖；\n访贫问苦住我家哎，\n帮俺农民搞土改。”"
 COX_back_home_NAME: "国土重光"
 COX_back_home_DESC: "卢沟宛平寸土决不让，淞沪笕杭陆空双捷战志昂。"
 COX_back_home_country_flag: "逐尽侵疆之敌，复故土以安四方。"
 COX_fix_the_timeline_NAME: "世界线修正"
 COX_fix_the_timeline_DESC: "“千年的铁树要开花。”"
 COX_fix_the_timeline_flag: "涤荡浊乱，定赤旗于天下之央。"
 COX_unattainable_illusions_NAME: "镜花水月"
 COX_unattainable_illusions_DESC: "天啊，我们现在到底在哪个世界线？"
 COX_unattainable_illusions_flag: "寻共和之旧途，成共治之新局。"
 COX_watch_from_west_NAME: "西北望乡"
 COX_watch_from_west_DESC: "大漠孤烟直，长河落日圆。"
