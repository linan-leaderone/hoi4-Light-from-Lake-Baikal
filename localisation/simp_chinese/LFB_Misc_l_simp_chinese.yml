l_simp_chinese:
 America_KMT: "中华民国流亡政府"
 America_KMT_tt: "\n\n£GFX_modifiers_America_KMT_icon\n\n\n\n旭日的阴影仍笼罩着中国大地，可\"委员长\"的名号却早已在大洋彼岸冷却。那些自诩为所谓\"继承者\"、\"解放者\"的人，只不过是蜷缩在华盛顿的阴影里的丧家之犬，啃食着早已腐朽的权力残羹。由钢铁与谎言铸就的\"流亡政府\"，不过是苟延残喘的空壳；那些曾响彻云霄的\"反攻\"口号，早已沦为哄骗残部的催眠曲。\n\n被充分解构的\"三民主义\"口号仍时不时盘旋在南京城上空——但那不过是供人耻笑的历史余烬而已。\n\n\n\n\n\n\n    £GFX_modifiers_KMT_sun_ke        £GFX_modifiers_KMT_song_mei_ling  \n\n\n\n\n\n\n £gezifu"
 COX_land_reform_finished: ""
 2499_030_LFB_achievements: "故土新花"
 2500_ksar_LFB_achievements: "阋墙御侮"
 COX_the_sunrise_of_north_NAME: "北境日升"
 COX_the_sunrise_of_north_DESC: "“当年个老李下乡来，\n夜打灯笼走山崖；\n访贫问苦住我家哎，\n帮俺农民搞土改。”"
 COX_back_home_NAME: "国土重光"
 COX_back_home_DESC: "卢沟宛平寸土决不让，淞沪笕杭陆空双捷战志昂。"
 COX_back_home_country_flag: "逐尽侵疆之敌，复故土以安四方。"
 COX_fix_the_timeline_NAME: "世界线修正"
 COX_fix_the_timeline_DESC: "“千年的铁树要开花。”"
 COX_fix_the_timeline_flag: "涤荡浊乱，定赤旗于天下之央。"
 COX_unattainable_illusions_NAME: "镜花水月"
 COX_unattainable_illusions_DESC: "天啊，我们现在到底在哪个世界线？"
 COX_unattainable_illusions_flag: "寻共和之旧途，成共治之新局。"
 COX_watch_from_west_NAME: "西北望乡"
 COX_watch_from_west_DESC: "大漠孤烟直，长河落日圆。"
 COX_watch_from_west_flag: "红星照耀西北。"
 COX_east_sik: "各民族友谊的壁垒"
 COX_east_sik_desc: "在新政权的领导下，东疆的流民危机得到解决，作为千年来各民族杂居的通衢之地，此地将成为我们向东解放全国的桥头堡，更是我们展现新中国各个民族和谐共处愿景的生动例证。"
 COX_north_sik: "西伯利亚哨探"
 COX_north_sik_desc: "基于哨所与巡逻队，北疆得以从西伯利亚的混乱中保护自身的安全，但至关重要的是英勇的西伯利亚哨探，他们轻装简行，深入危机四伏的原野。他们带来的情报，是维持防线最重要的依仗。"
 COX_south_sik: "喀什教义辩论"
 COX_south_sik_desc: "这场辩论是起点，标志着革命不仅要改变物质世界，更要重塑人们认识世界的方式。"
 COX_central_urumqi: "国营企业试点"
 COX_central_urumqi_desc: "尽管是不得已而为之，盛世才时期硕果仅存的重工业已被尽数国有化。包括新疆兵工厂，迪化水泥厂，新疆机械制造厂在内的诸多企业，将成为苏区进一步发展的基石。"