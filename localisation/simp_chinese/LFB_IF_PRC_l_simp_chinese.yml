#nation_focus
COX_Hold_The_Long_Cord: "长缨在手"
COX_Hold_The_Long_Cord_desc: "从1921至今，历经半个世纪、两代共产党人的流血牺牲，中国人民终于实现了长久以来的梦想：建立起独立自主的社会主义中国。但解放只是迈向社会主义的第一步。\n\n在内部，无数的国民党残部与日伪份子仍未被清算，半数国土尚未开始土改，经历过两次大战的红军战士筋疲力尽，已再难支撑起下一场大战，而无数敌特分子仍潜伏暗处，为日寇重整军备争取时间。\n\n在外部，残暴的日本帝国主义绝不会甘心咽下失败的苦果，总有一天会卷土重来；朝鲜人民和台湾同胞们仍生活在日寇的刺刀之下，期盼着我们的解放；西方，新生的苏维埃联盟仍在与凶悍的纳粹德国对峙，下一场西俄战争早已进入倒计时，紧随其后的定然是解放全欧洲的世界革命；而大洋彼岸，我们仍不可知新生的国际共运对那古老的资本主义堡垒意味着什么。\n\n不过，无论未来如何，当下我们都是毫无疑问的胜利者，只要抓住眼下的时机重整旗鼓，我们一定能再次创造奇迹，扫除眼下的一切困难，让中华民族和共产主义重回世界舞台的中心。"
COX_The_End_Of_ROC: "民国梦醒"
COX_The_End_Of_ROC_desc: "自1912年至今已近六十年，仍有许多理想者怀念辛亥革命和几次北伐时的热血沸腾，试图为“三民主义”擦去买办和汉奸们为它抹上的污渍。\n\n但共产党人和中国人民已经用行动回答：到此为止了。\n\n作为一个诞生于清廷末期，指导资产阶级的革命理念，三民主义已经完成了它的历史使命。可到今日，“三民主义”四个字的含义一变再变，从清廷治下孙中山的革命理想、到戴季陶的阶级合作、胡汉民的东方民族革命、蒋中正的力行新生活、汪精卫的大亚洲主义……\n\n如今我们已经没有耐心听人解释孙中山先生的哪本书、哪次讲话中的某句话说明了民权、民族、民生的什么涵义或相互之间的什么关系。我们仍会为三民主义保留最后的体面，让它代表着中国人民抗击封建统治的旧民主主义铭记于历史书上。\n\n现在该迎接新民主主义了。"
COX_Transform_The_Blue_Sky: "改换青天"
COX_Transform_The_Blue_Sky: "日本帝国主义在中国敲骨吸髓数十年之久，靠的不只是凶残的军队，还有奴颜婢膝的汉奸。\n\n这些汉奸背弃了曾经的理想，为了名利不惜出卖同胞的血肉换取日本人的残羹冷炙。如今我们击溃了日本人的军队，这些汉奸又转头乞求原谅，甚至想要继续为民国政府工作。\n\n中国人民不会原谅他们的背叛，但我们不会拘泥于民族仇恨，更不会浪费建设社会主义法治的机会。\n\n《惩治汉奸条例》已下发各级人民政府。陈公博、周佛海这些卖国贼都将接受人民群众的审判，再由人民政府执行判决，杜绝私刑和滥杀。第一批监狱和劳改营的建设也将提上日程，对于未害人命或罪行不重的汉奸，将允许他们在改造和服刑结束后回归社会。"
COX_Shoot_The_White_Sun: "射落白日"
COX_Rebuild_Grass_roots_Organizations: "重建基层"
COX_Rebuild_Grass_roots_Organizations_desc: "抗日烽火、内战纷争，以及漫长的岁月流转，像锋利的刀刃般划破了这片土地的每一寸肌理。抗日战争的浴血奋战、中国内战的腥风血雨，再加上1945年那沉痛的失败，早已将我们曾辛苦建立的基层组织撕裂得支离破碎。村庄、城镇、乡里，那些原本紧密相连的红色网络，在连年的战火下化作灰烬，群众与政权之间的桥梁被彻底摧毁。然而，时局已变。日寇被逐，失落的政权再次回到我们手中，这是重建的号角，更是涅槃的开始。如今，重建基层组织已刻不容缓。这不仅是为了推进土地改革、经济复苏和社会重塑，更是为了让党的声音再次传遍每一个角落，直达田间地头。我们将重新在每个村庄、每个街区乃至每个工厂中建立党支部，吸纳可靠的党员干部，发动群众参与重建，确保每一条命令、每一项政策都能迅速传达并落地生根。基层，是人民政权的根基。没有坚实的基层组织，再伟大的蓝图也不过是空中楼阁。只有当党的旗帜在每一个村头飘扬，当人民的声音能直达权力的核心，我们的国家才能真正稳固、繁荣。让我们肩负起这历史的责任，重塑基层的血脉，再次让这片土地焕发生机与希望！"
COX_A_Devastated_Country: "国步艰难"
COX_Banditry: "匪患"
COX_Banditry_desc: "在战火硝烟尚未完全散去的土地上，黑暗的阴影依旧盘踞。日本侵略者虽已溃败，但他们残留的散兵游勇仍然在丛林与山地间苟延残喘。而更为狡诈险恶的，是那些在国民党溃败时遗留下的反动武装与特务——他们并未随政权的覆灭而消失，反而如毒蛇般潜伏在各地，伺机而动。这些武装分子与地方横行多年的土匪恶霸勾结，形成了一张错综复杂的地下网络。\n\n这些匪患并非乌合之众。他们有组织、有计划，甚至拥有从敌占区遗留下的武器与情报支持。白天，他们潜伏在山林和乡村的暗角，夜幕降临之际，便开始肆无忌惮地行动：抢掠粮食、袭击哨所、煽动叛乱，甚至在某些地区制造了骇人听闻的大规模屠杀事件。他们不仅威胁到人民的生命财产安全，更试图动摇新生政权的根基。\n\n每一次枪声的回响，都是对人民政权的挑衅；每一次村庄的燃烧，都是对社会安宁的践踏。若任其滋生蔓延，这片苦难深重的土地将永无宁日。我们绝不能坐视不理，不能让这些毒瘤继续侵蚀国家的肌体。铁与火的洗礼已经结束，然而新的斗争才刚刚开始。"
COX_Unfinished_Business_PRC: "未竟之事"
COX_Unfinished_Business_PRC_desc: "1931年9月18日，东北的夜空被炮火撕裂，关东军以区区借口发动突袭，仅四月光景，锦绣黑土尽数沦陷。傀儡政权登场，日寇的铁蹄践踏三千万同胞，十四载苦难铺满山河。亡国的屈辱，沉重地压在每一个东北人的肩头。\n\n如今，战局生变，祖国大地迎来解放曙光。然则东北依旧在敌手掌控之下，攻势受阻，前线静默。战士的目光却从未离开那片故土，旧抗联的残部在西北集结，故人重逢，誓言未改。游击队于白山黑水间潜伏，地下组织在长春、哈尔滨、沈阳的阴影中积蓄力量，静待时机。\n\n秩序正在松动，裂隙逐步显现。日寇管理不善，伪政权已是风雨飘摇。西满洲将成为突破口，游击队与抗联老兵汇合，筹划反攻。战旗终将再度升起，硝烟将在白山黑水间燃烧，旧恨未消，新仇已至，东北的回归，已在路上。"
COX_Establish_The_Central_Military_Commission: "改组中央军委"
COX_Establish_The_Central_Military_Commission_desc: "自1926年红军初具雏形时，指挥系统便在硝烟与炮火中逐步成型。从井冈山的密林深处到万里长征的千山万水，再到最终的胜利会师，每一步都离不开一个强有力的军事指挥核心。然而，革命的枪声虽已沉寂，国家的重建之路却仍漫长而艰巨。在这个历史的转折点上，我们必须着眼长远，为巩固人民政权、维护国家安全奠定坚实的军事基础。\n\n是时候重塑军队的灵魂，改组中央军事委员会了。它将统筹全国武装力量，统一战略部署，确保军令如山，行动迅捷果断。不仅如此，中央军委还将主导海陆空三军的重建与现代化，为未来的任何威胁做好万全准备。无论是高空翱翔的战鹰，还是乘风破浪的舰队，亦或是坚如磐石的陆地钢铁洪流，都将在中央军委的调度下紧密配合，构筑起一道坚不可摧的钢铁长城。"
COX_Receive_Their_Inheritance: "接收遗产"
COX_Receive_Their_Inheritance_desc: ""
COX_Reorganize_Red_Army: "整编红军"
COX_Reorganize_Red_Army_desc: "红军和党与中国人民在这几十年间经历了同样的颠沛流离，四散部队与游击队已经数不胜数。而在新疆革命根据地建立后以及后来的大东亚战争间，不断收拢的部队与新编入的新部队也使得本就脆弱红军的组织架构更加不堪。而同时，中央也接到了不少有关离散红军组织与游击队习气恶化思想脱线的报告。鉴于这些年的斗争形势，我们不能责怪他们太多，可我们同样也不能够容忍这样的风气继续存在。借着新中国建立后大破大立的浪潮，党中央已经决心对红军上下进行一次总的整顿与整编，将红军上下的体系架构总的梳理一遍，以使身经百战的红军焕发新的战斗力。"
COX_Iron_Red_Guards: "赤卫如钢"
COX_Iron_Red_Guards_desc: "新中国建立后，红军原有的军事指挥体系显然已经不适应当前全国山河一片红的局势，也势必会拖累红军完成其保卫人民群众生产生活的新任务。\n\n建立一个全国范围内总的军事指挥架构已经是势在必行，按照地理特点以及历史沿革。全国将会被分成五大军区，方便中央抓总指挥统一调动，同时军队的指挥机构也将充分地与当地政府协调合作。在新解放区，民兵的挑选训练工作也在紧锣密鼓的进行中。\n\n与此同时，红军新的训练操典与新的规章章程编写也会启动。多方政策并管齐下，身经百战的红军将能够更好地适应新的形新的任务，并在新的斗争中与党和人民站在一道，成为打击国内外反动派最坚固的铁拳。"
COX_Eventually_Bind_The_Dragon: "终缚苍龙"
COX_Eventually_Bind_The_Dragon_desc: "在党的领导下，中国人民了结了日本帝国主义者对中国的占领与奴役洗刷了百余年间的耻辱。尽管蹒跚，但如今的中国已然重新挺立起来，重新回到世界的牌桌上。\n\n现在的形式仍不乐观，内是百废待兴的国土，外有日帝国主义不死心的环伺。然而我们已经迈出了最为艰难的第一步。我们坚信，在党中央的带领下，在全国人民的劳动下，新生的红色中国必会继续扫清国内外的一切牛鬼蛇神，并成为全世界民族解放的范本，全球受奴役人民的灯塔。并给这黑暗的世界带来一丝破晓的曙光。\n\n§R由此上溯到一千八百四十年，从那时起，为了反对内外敌人，争取民族独立和人民自由幸福，在历次斗争中牺牲的人民英雄们永垂不朽！§!"

#ideas
DMN_Northern_Spring: "北国之春"

#events
 LFB_IF_PRC.7.t:"涤瑕荡垢"
 LFB_IF_PRC.7.desc:"在车上颠簸了一整天后，罗卫华和他的战友们——一个专门抽调来的步兵营终于来到了贵台镇，广西十万大山中的一个普通城镇。\n\n营长先去了当地人武部了解情况，各连连长则吆喝着同志们把武器装备卸下车来，罗卫华和班长老李抬下一条板条箱，箱子上“七六式单兵火箭筒”字样清晰可见。\n\n“这筒子可是好东西，打解放战争的时候，打工事，拔碉堡贼好用”老李摩挲着板条箱上的文字，“那会还是北边的苏联同志援助过来的，叫什么……RPG，现在我们也能自己造啦……嘿嘿，到时候要那群山匪好看！”罗卫华放下板条箱，直起腰望了望不远处的贵台镇，镇子并不热闹，门店开得不多，送葬的队伍冒着细雨在土路上行进。“这贵台镇怎么没点生气呢……”罗卫华正自己嘀咕着，老李却自顾自的接过了话：“这山匪窝在山里边，时不时地就下山抢钱抢粮，有时候还要抢女人上山去，末了还杀人，哪个地方经得起这么糟蹋！”\n“那为什么地方的驻军……”\n“你是说想要地方的驻军来剿匪？地方的同志们还得保卫关键地方生产呐！这群山匪胆子大了是真敢进攻城市的！要是地方的同志顾得过来中央也不会调我们来了……”老李突然自顾自的气愤起来，“妈的这群山匪，就知道欺软怕硬打劫老百姓，要叫我碰见……”“砰”地一声，他的拳头猛然砸在板条箱上：“你看我用不用火箭筒把你们送上天！”"
 LFB_IF_PRC.7.a:"“叫你尝尝人民的铁拳！”"
 LFB_IF_PRC.918.t:"雪消时节"
 LFB_IF_PRC.918.desc:"在两股伟力的激烈碰撞下，草原东部洒满了鲜血，隆冬时节，西伯利亚的信风送来厚雪，埋葬了未及时收敛的尸体，还有一切誓言，荣耀，与人世间的重要之物。而后春日降临，繁华更胜往日的草甸间缀满了繁花，若有人踏青驻足，便会理所应当的为这和平之景赞叹。但在此时此地，并无人有此闲心逸志——受尽压迫与战乱折磨的人们正想法设法地跨越边境，他们拖家带口，越过危险的无人区——虽然硝烟已经散尽，但草甸间仍潜藏着大量地雷与未爆弹。\n\n人们冒着生命危险也要离开的原因，便是因为此时西东北混乱的时局。虽然这片地区名义上是中国和满洲之间的争议领土，但仍在各方面与旧满洲国有着千丝万缕的联系。而在某些层面而言，反倒是“青出于蓝”——作为一片非军事化的地区，地方政府根本无法对各地施行有效的控制，以致六十年代一度被压制的匪患再度猖獗。故此，几近沦为无法之地的西满洲，就这样以澎湃的动力向西方输出着难民潮。\n\n元气大伤的日本帝国乐见西满洲忠实地履行着“缓冲区”的职能，并未过多地干涉此地的混乱，而这反倒给了新生的人民政府可乘之机。踏着薄草甸，一支游击队正逆着人潮行进，各异的制服，疲惫的神色，汇成一条铅色的涓流，汩汩向东。作为旧日“匪患”的一部分，他们有着一个更响亮的名字——“东北抗联”。如今解放军受条约所限无法直接进入争议地区，只能转而暗中支持已经销声匿迹许久的东北抗日武装。他们背负着夺回故土的责任，奋战在解放的最前线，与各色匪帮战斗，与日本帝国的肮脏汉奸代理人战斗……"
 LFB_IF_PRC.918.a:"白雪之下，黑土之中，沉眠的种子即将发芽。"
 LFB_IF_PRC.1917.t:"致中国同志的一封信"
 LFB_IF_PRC.1917.desc:"亲爱的主席同志：\n\n请允许我对你们在战胜日本帝国主义者中付出的巨大努力致以崇高的敬意，中国人民的英雄主义和自我牺牲的精神最终铸就了对日帝国主义的伟大胜利，而这一成就极大的鼓舞了世界各地的被压迫人民，我们对此向你们表示衷心的感谢。\n\n我们的现在的境遇也和不久之前的你们一样，在我们解放全国的道路上充满了各种困难。在这种情况下，我们的人民一度对将来与纳粹主义者的决战充满忧虑。但现在，你们证明了帝国主义者绝非不可战胜，世界上从来都没有无敌的军队，过去的成吉思汗和拿破仑是这样，现在的日本军队也是这样，将来的纳粹军队亦将会是这样。\n\n尽管我们目前的遭遇是痛苦的，我们与纳粹主义者的斗争是一场力量对比极其悬殊的斗争，但中国人民的斗争为我们提供了一个良好的榜样，我们也将如你们一般尽一切力量争取独立与自由。你们的胜利就是我们的胜利，日帝国主义者遭受的失败也将是纳粹主义者遭受的失败。\n\n同时，苏维埃社会主义共和国联盟真诚希望实现我们两国的共同利益，并不顾敌视这种关系的帝国主义势力的反抗，使我们之间的友谊建立在不可动摇的基础之上。我们深信，苏维埃社会主义共和国联盟和中华人民共和国一定能团结起来，迫使帝国主义者放弃破坏中苏两国关系与远东地区稳定、将我们逐个击破的妄想。\n\n让我们在为全世界无产阶级共同利益而进行的伟大斗争中更紧密地联合我们的队伍。中国劳动农民万岁！中国工人万岁！苏、中两国无产阶级联盟万岁！\n\n我们怀着最真诚的愿望祝中国无产阶级兴盛与自由，也祝愿我的中国朋友们健康幸福。\n\n                                                 苏维埃社会主义共和国联盟外交人民委员\n                                                                             李德"
 LFB_IF_PRC.1917.a:"我们的伟大友谊万岁！"
 LFB_IF_PRC.101.t:"龙骸之上"
 LFB_IF_PRC.101.d:"李木匠坐在自家门槛上，用磨得发亮的刨子修整着一块木料。刨花卷曲着落下，像时间的碎屑。他的大半辈子，都活在龙的阴影下。\n\n那条龙，人们曾叫它“青天白日”，叫它“国民政府”。它曾是希望，是驱逐满清、缔造共和的英雄。但很快，它变成了别的东西。它变成了四大家族的金库，变成了保甲长的勒索，变成了兵匪不分的抓丁，变成了抗日时节节败退的借口，最后，变成了与同胞兵戎相见的冷酷机器。\n\n它盘踞在这片土地上，太久了。它的鳞片是苛捐杂税，它的爪牙是特务和宪兵。它承诺给人民一个国家，却只给了他们一个不断更换主人的枷锁。\n\n先是日本人来了，龙被打断了脊梁，却还死死缠在地上。然后，红色的火焰从北方烧来，和这条衰老而顽固的龙缠斗在一起。李木匠的儿子，就在那场最后的战斗中，再也没回来。\n\n如今，枪声彻底停了。报纸上说，“反动派”的最后据点被攻克，那条苍龙终于被彻底捆缚，咽下了最后一口气。\n\n李木匠抬起头，看向远方。天，还是那片天，但似乎更清明了些。街上走着穿着统一灰色制服的干部，他们说话的方式很直接，很有力，虽然有时让人听不太懂，但他们的眼神里没有龙的贪婪。这个国家，终于不再被那条衰老、腐朽的巨龙所撕扯。\n\n龙死了。它的骸骨将化为新世界的基石。这或许是好事。\n\n李木匠低下头，继续刨着他的木头。新的房子需要梁柱，新的学校需要桌椅。生活要继续，国家要重建。在龙的尸体上，他们要建起一个属于“人民”的世界。\n\n他不知道这个新世界会是什么样子，但他知道，它必须，也必然会和旧的不同。"
 LFB_IF_PRC.101.a:"旧时代的龙，再也不能兴风作浪了。"
 LFB_IF_PRC.1977.t:"熔炉与铁砧"
 LFB_IF_PRC.1977.d:"政委张海平站在一群年轻的士兵面前，他们的脸庞还带着田埂上的泥土气息和城市的迷茫。他们是新中国的第一代士兵。他们的父辈，曾在不同的旗帜下作战——有些是八路军，有些是国军，有些甚至是被强征的伪军。他们带着旧时代的仇恨、习惯和伤疤。\n\n而张海平的任务，就是将这一切从他们身上彻底剥离，然后将他们重新锻造成一种全新的、坚不可摧的物质。\n\n“你们以为你们手里拿的是什么？”他的声音不大，却像鞭子一样抽打在每个人的耳膜上，“是烧火棍吗？是你们从地主家抢来的锄头吗？错！”\n\n他走到一个因紧张而发抖的年轻士兵面前，拿起他的步枪。\n\n“这是阶级斗争的工具！这是无产阶级专政的铁拳！它的准星，瞄准的不是某个具体的人，而是剥削、是压迫、是帝国主义和一切反动派！”\n\n他放下枪，目光扫过整个队列。\n\n“你们当中，有的人的父亲是国军，被我们击败了。很好！那证明了旧军队的腐朽和反动！你们要做的，不是继承他们的失败，而是从他们的失败中吸取教训，站到人民的一边！”\n\n“有的人的哥哥是八路，在抗日时牺牲了。很好！那证明了我们这支军队的荣耀与传承！你们要做的，就是继承他的遗志，将革命进行到底！”\n\n“忘掉你们是哪里人，忘掉你们的出身！在这里，你们只有一个身份——人民解放军战士！你们的信仰只有一个——共产主义！你们的敌人只有一个——所有试图阻碍人民获得解放的势力！”\n\n张海平的声音在空旷的训练场上回响。他不是在训练一群士兵如何开枪，他是在一个巨大的熔炉边，用意识形态的铁锤，将一块块成分复杂的生铁，反复捶打，淬火，直到它们变成坚硬、纯粹、标准划一的钢。\n\n这支军队，将不会再有派系、山头和私心。它将成为一把指向未来的、赤红色的利剑。"
 LFB_IF_PRC.1977.a:"以革命的名义，锻造他们。"
 LFB_IF_PRC.1978.t:"无尽的报告"
 LFB_IF_PRC.1978.d:"南京的深夜，寂静无声。\n\n毛岸英揉了揉酸痛的太阳穴，试图从堆积如山的报告中抬起头来。胜利的喜悦早已褪去，只剩下无尽的、冰冷的现实。他觉得自己不像一个国家的领袖，更像一个濒临破产的作坊主，绝望地翻看着永远也还不清的账单。\n\n一份报告来自河南：春旱已经持续了两个月，数百万人的口粮告急。地方干部请求中央紧急调粮，但国库里的小米，连下个月首都的配给都不够。\n\n另一份来自东北：刚刚从废墟中恢复的钢厂再次停产。那里的设备大多是日本人留下的，图纸和备用零件都找不到，现在全凭着几个经验丰富的老工人在勉力维持。一份报告称，高炉的技术数据已经丢失，再强行开工可能会导致毁灭性的事故。\n\n第三份来自福建沿海：内务部的同志们送来了一份长长的名单，上面全是潜伏下来的国民党特务和他们联系的地方宗族势力。报告的结尾用血红的墨水写着：“若不施以雷霆手段，东南沿海恐生巨变。”但“雷霆手段”意味着什么？又一场清洗？又一次流血？\n\n还有来自甘肃的电报，说那里的铁路修了一半就停了。当地的干部和工程队就路线规划问题产生了严重分歧，一方认为应优先连接贫困地区，另一方则坚持要先打通资源产区，双方都引用着语录指责对方是“唯心主义”和“官僚主义”，工程已经停滞了数周。\n\n……\n\n每一份报告都是一个正在流血的伤口。每一份报告都需要一个决定，一个方案，一笔他根本拿不出来的资金。他打赢了日本人，又打赢了国民党，他以为最艰难的部分已经过去了。但他错了。消灭一个旧世界，远比建设一个新世界要简单。\n\n他靠在椅背上，闭上了眼睛。窗外，是四亿五千万嗷嗷待哺的人民。桌上，是这个国家数不清的沉疴与顽疾。他感觉自己被压得喘不过气来。\n\n这条路，到底要怎么走下去？"
 LFB_IF_PRC.1978.a:"……先处理完下一份吧。"

 LFB_IF_PRC.1644.t:"[Get_newspaper_header]西满洲剧变"
 LFB_IF_PRC.1644.desc:"中日战争结束后，双方围绕着满洲问题在谈判中进行了多轮拉锯。最终，满洲西部的大片地区被划为了待议领土，由满洲帝室成员溥杰为首的重建委员会负责该地区行政。不过战后满洲地区混乱的局势决定了重建委员会根本无力对地方进行有效掌控，西满洲地区事实上已经成为了一片无政府地区。\n\n但近日，一支名为“东北民主联军”的武装力量异军突起，控制了重建委员会驻地承德，并宣称已经在整个西满洲地区建立起了有效的基层政权。据悉，这支武装力量的领导人正是原东北抗日联军的领导人之一。\n\n东京方面措辞严厉地谴责了中国支持武装分子、试图破坏满洲地区稳定的恶劣行径；而北京方面则表示这不过是东北人民追求民主的自发行为，中方支持人民的选择。值得注意的是，新京方面对于此事未发表任何意见，这种态度很可能暗示着满洲政坛目前正处于动荡之中。"
 LFB_IF_PRC.1644.a:"母亲，归期到了，快领我们回来！"
 LFB_IF_PRC.1644.b:"虚与委蛇，令人发指……"
 LFB_IF_PRC.1644.c:"昔日的三极之一已难掩颓势。"