  JAP_puppet_no_war:"离心离德的共荣圈"
  JAP_puppet_no_war_desc:"我们一直大力鼓吹共荣圈内部的团结协作，可当危机真正来临，我们的盟友和傀儡们却并未积极地维护“东亚共荣”。要么是被内部的冲突折磨得焦头烂额，要么是出于自身利益冷眼旁观，他们在这关键时刻并不愿为日本人而在东亚战场上流血。\n§R中国问题只能由我们独自解决了。§！"
  JAP_sphere_no_war:"离心离德的共荣圈"
  JAP_sphere_no_war_desc:"日本方面一直大力鼓吹共荣圈内部的团结协作，但考虑到当前局势，我们并不会积极地维护这所谓的“东亚共荣”。要么是被内部的冲突折磨得焦头烂额，要么是出于自身利益冷眼旁观，我们没有理由在这个节骨眼上为日本人而在东亚战场上流血。\n§R中国的问题就交给他们自己解决吧。§！"
  
