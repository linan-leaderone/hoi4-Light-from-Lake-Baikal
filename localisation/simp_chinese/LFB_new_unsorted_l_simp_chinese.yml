  ##决议
  COX_Liberation_of_Lanzhou:0 "解放兰州"
  COX_Liberation_of_Lanzhou_desc:0 "\n\n\n§C起来，不愿做奴隶的人们！§!当西南的护国军冲进长沙的城门之时，§e日寇§!便已不得不凝神谛听中华民族追求自由的怒吼。\n可以预见的是，日寇即将对中华大地掀起一场血腥的，旷日持久的战争，在这种情况下，唯有§D整个中华民族§!的联合才能御敌求自由。现在便是向日寇宣战的最佳时机，尽管我们在第一次夺取兰州时遭遇了挫折，但同时也取得了一定成果：日军在我们的打击之下被迫收缩，兰州城外四处活跃着§C抗日游击队§!。为了全中华民族的自由，我们将第一次与§w武装到牙齿§!的日军正面对峙。\n如果我们能够夺下兰州，即可有效分散我们的盟友在其他区域的压力，相信§V全中国乃至整个东亚§!一旦联合起来，我们便能够看见§M自由的曙光。§!"
  COX_Liberation_of_Lanzhou_countdown:0 "机不可失…" 
  COX_Liberation_of_Lanzhou_countdown_desc:0 "护国军在西南的战术胜利打乱了日军的阵脚，驻扎兰州的西北方面军开始紧急调动。这产生了一个稍纵即逝的机会，我们必须尽快做好准备，发动进攻。" 
  COX_Liberation_of_Lanzhou_war_timer:0 "…时不再来"
  COX_Liberation_of_Lanzhou_war_timer_desc:0 "就在红军开进兰州的同时，西北军也在执行着他们的撤退计划。如果我们未能在一定时间内将他们切断，就会彻底失去这一歼灭敌军一大主力的机会。"
